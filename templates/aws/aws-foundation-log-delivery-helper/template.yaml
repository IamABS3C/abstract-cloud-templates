AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Abstract Security - Helper (Lambda-backed custom resource). Provides the
  deploy-time "lookup / resolve / validate" capability that plain CloudFormation
  cannot: it resolves a KMS alias, SQS queue name, Kinesis stream name, or WAF
  WebACL name to its ARN, validates that an S3 bucket exists, and (optionally)
  wires a producer by enabling S3 server-access logging on a source bucket or
  access logs on an existing load balancer. Deploy it standalone to perform one
  operation and read the resolved value from the outputs, OR deploy once and
  reuse the exported ServiceToken from other stacks via Custom::AbstractHelper.
  All read operations use read-only APIs; producer-wiring (write) APIs are only
  granted when a wiring Operation is selected or AllowProducerWiring=true.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Operation" }
        Parameters: [Operation, AllowProducerWiring]
      - Label: { default: "Lookup / resolve inputs" }
        Parameters: [KmsAlias, QueueName, BucketName, StreamName, WebAclName, WebAclScope, LogGroupName]
      - Label: { default: "Producer-wiring inputs" }
        Parameters: [SourceBucketName, TargetBucketName, TargetPrefix, LoadBalancerArn]
      - Label: { default: "Function settings" }
        Parameters: [LogRetentionDays, FunctionTimeout]
    ParameterLabels:
      Operation: { default: "What should the helper do?" }
      AllowProducerWiring: { default: "Grant write (producer-wiring) permissions?" }

Parameters:
  Operation:
    Type: String
    Default: None
    AllowedValues:
      - None
      - ResolveKmsKey
      - ResolveQueue
      - ValidateBucket
      - ResolveStream
      - ResolveWebAcl
      - CheckLogGroup
      - EnableS3SourceLogging
      - EnableAlbAccessLogs
    Description: >-
      None just deploys the reusable function (export ServiceToken). The Resolve*/
      Validate*/Check* operations look something up and return it in the outputs.
      Enable* operations wire a producer (write).

  AllowProducerWiring:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Attach the write permissions (S3 PutBucketLogging, ELB ModifyLoadBalancerAttributes) so the exported function can perform Enable* operations later. Auto-on when Operation is an Enable* operation.

  KmsAlias:
    Type: String
    Default: ""
    Description: "KMS alias to resolve (e.g. alias/my-key) for ResolveKmsKey. Find it with: aws kms list-aliases"
  QueueName:
    Type: String
    Default: ""
    Description: "SQS queue NAME to resolve to URL+ARN for ResolveQueue. Find it with: aws sqs list-queues"
  BucketName:
    Type: String
    Default: ""
    Description: "S3 bucket to validate exists (ValidateBucket). Find it with: aws s3 ls"
  StreamName:
    Type: String
    Default: ""
    Description: "Kinesis stream name to resolve to ARN (ResolveStream). Find it with: aws kinesis list-streams"
  WebAclName:
    Type: String
    Default: ""
    Description: "WAF WebACL name to resolve to ARN (ResolveWebAcl). Find it with: aws wafv2 list-web-acls --scope REGIONAL"
  WebAclScope:
    Type: String
    Default: REGIONAL
    AllowedValues: [REGIONAL, CLOUDFRONT]
    Description: Scope for ResolveWebAcl (CLOUDFRONT must run in us-east-1).
  LogGroupName:
    Type: String
    Default: ""
    Description: "CloudWatch log group to check exists (CheckLogGroup). Find it with: aws logs describe-log-groups --query logGroups[].logGroupName"

  SourceBucketName:
    Type: String
    Default: ""
    Description: "S3 bucket to enable server-access logging ON (EnableS3SourceLogging). Find it with: aws s3 ls"
  TargetBucketName:
    Type: String
    Default: ""
    Description: "Destination log bucket for EnableS3SourceLogging / EnableAlbAccessLogs. Find it with: aws s3 ls"
  TargetPrefix:
    Type: String
    Default: ""
    Description: Key prefix in the destination bucket.
  LoadBalancerArn:
    Type: String
    Default: ""
    Description: "ARN of the ALB/NLB to enable access logs on (EnableAlbAccessLogs). Find it with: aws elbv2 describe-load-balancers --query LoadBalancers[].LoadBalancerArn"

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
  FunctionTimeout:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 300

Conditions:
  HasOperation: !Not [!Equals [!Ref Operation, "None"]]
  IsWriteOp: !Or
    - !Equals [!Ref Operation, "EnableS3SourceLogging"]
    - !Equals [!Ref Operation, "EnableAlbAccessLogs"]
  AttachWrite: !Or
    - !Condition IsWriteOp
    - !Equals [!Ref AllowProducerWiring, "true"]
  OpResolveKms: !Equals [!Ref Operation, "ResolveKmsKey"]
  OpResolveQueue: !Equals [!Ref Operation, "ResolveQueue"]
  OpValidateBucket: !Equals [!Ref Operation, "ValidateBucket"]
  OpResolveStream: !Equals [!Ref Operation, "ResolveStream"]
  OpResolveWebAcl: !Equals [!Ref Operation, "ResolveWebAcl"]

Resources:
  HelperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-helper"
      RetentionInDays: !Ref LogRetentionDays

  HelperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt HelperLogGroup.Arn
        - PolicyName: read-lookups
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kms:ListAliases
                  - kms:DescribeKey
                  - sqs:GetQueueUrl
                  - sqs:GetQueueAttributes
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - kinesis:DescribeStreamSummary
                  - wafv2:ListWebACLs
                  - logs:DescribeLogGroups
                Resource: "*"
        - !If
          - AttachWrite
          - PolicyName: producer-wiring
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: [s3:PutBucketLogging, s3:GetBucketLogging]
                  Resource: "*"
                - Effect: Allow
                  Action: [elasticloadbalancing:ModifyLoadBalancerAttributes, elasticloadbalancing:DescribeLoadBalancerAttributes]
                  Resource: "*"
          - !Ref "AWS::NoValue"
      Tags:
        - { Key: Purpose, Value: AbstractSecurity }

  HelperFunction:
    Type: AWS::Lambda::Function
    DependsOn: [HelperLogGroup]
    Properties:
      FunctionName: !Sub "${AWS::StackName}-helper"
      Description: Abstract Security lookup / resolve / producer-wiring custom resource.
      Runtime: python3.12
      Handler: index.handler
      Timeout: !Ref FunctionTimeout
      MemorySize: 128
      Role: !GetAtt HelperRole.Arn
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3

          def send(event, context, status, data=None, reason=None, pid=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or ("See CloudWatch log stream: " + context.log_stream_name),
                  "PhysicalResourceId": pid or event.get("PhysicalResourceId") or context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": data or {},
              }).encode("utf-8")
              req = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT",
                  headers={"content-type": "", "content-length": str(len(body))})
              urllib.request.urlopen(req)

          def resolve_kms(props):
              alias = props["KmsAlias"]
              kms = boto3.client("kms")
              for page in kms.get_paginator("list_aliases").paginate():
                  for a in page["Aliases"]:
                      if a.get("AliasName") == alias and a.get("TargetKeyId"):
                          return {"Arn": kms.describe_key(KeyId=a["TargetKeyId"])["KeyMetadata"]["Arn"]}
              raise Exception("KMS alias not found: " + alias)

          def resolve_queue(props):
              sqs = boto3.client("sqs")
              url = sqs.get_queue_url(QueueName=props["QueueName"])["QueueUrl"]
              arn = sqs.get_queue_attributes(QueueUrl=url, AttributeNames=["QueueArn"])["Attributes"]["QueueArn"]
              return {"QueueUrl": url, "QueueArn": arn}

          def validate_bucket(props):
              boto3.client("s3").head_bucket(Bucket=props["BucketName"])
              return {"BucketName": props["BucketName"]}

          def resolve_stream(props):
              d = boto3.client("kinesis").describe_stream_summary(StreamName=props["StreamName"])
              return {"StreamArn": d["StreamDescriptionSummary"]["StreamARN"]}

          def resolve_webacl(props):
              waf = boto3.client("wafv2")
              scope = props.get("WebAclScope", "REGIONAL")
              token = None
              while True:
                  kw = {"Scope": scope, "Limit": 100}
                  if token:
                      kw["NextMarker"] = token
                  resp = waf.list_web_acls(**kw)
                  for w in resp.get("WebACLs", []):
                      if w["Name"] == props["WebAclName"]:
                          return {"Arn": w["ARN"], "Id": w["Id"]}
                  token = resp.get("NextMarker")
                  if not token:
                      break
              raise Exception("WebACL not found: " + props["WebAclName"])

          def check_log_group(props):
              name = props["LogGroupName"]
              logs = boto3.client("logs")
              for page in logs.get_paginator("describe_log_groups").paginate(logGroupNamePrefix=name):
                  for g in page["logGroups"]:
                      if g["logGroupName"] == name:
                          return {"LogGroupName": name, "Arn": g["arn"]}
              raise Exception("Log group not found: " + name)

          def enable_s3_logging(props):
              s3 = boto3.client("s3")
              s3.put_bucket_logging(
                  Bucket=props["SourceBucketName"],
                  BucketLoggingStatus={"LoggingEnabled": {
                      "TargetBucket": props["TargetBucketName"],
                      "TargetPrefix": props.get("TargetPrefix", "")}})
              return {"Configured": props["SourceBucketName"]}

          def enable_alb_logging(props):
              elb = boto3.client("elbv2")
              elb.modify_load_balancer_attributes(
                  LoadBalancerArn=props["LoadBalancerArn"],
                  Attributes=[
                      {"Key": "access_logs.s3.enabled", "Value": "true"},
                      {"Key": "access_logs.s3.bucket", "Value": props["TargetBucketName"]},
                      {"Key": "access_logs.s3.prefix", "Value": props.get("TargetPrefix", "")}])
              return {"Configured": props["LoadBalancerArn"]}

          OPS = {
              "ResolveKmsKey": resolve_kms,
              "ResolveQueue": resolve_queue,
              "ValidateBucket": validate_bucket,
              "ResolveStream": resolve_stream,
              "ResolveWebAcl": resolve_webacl,
              "CheckLogGroup": check_log_group,
              "EnableS3SourceLogging": enable_s3_logging,
              "EnableAlbAccessLogs": enable_alb_logging,
          }

          def handler(event, context):
              try:
                  if event["RequestType"] == "Delete":
                      send(event, context, "SUCCESS")
                      return
                  props = event.get("ResourceProperties", {})
                  op = props.get("Operation", "None")
                  data = {} if op == "None" else OPS[op](props)
                  send(event, context, "SUCCESS", data)
              except Exception as e:  # noqa: BLE001
                  send(event, context, "FAILED", reason=str(e))
      Tags:
        - { Key: Purpose, Value: AbstractSecurity }

  HelperOperation:
    Type: Custom::AbstractHelper
    Condition: HasOperation
    Properties:
      ServiceToken: !GetAtt HelperFunction.Arn
      Operation: !Ref Operation
      KmsAlias: !Ref KmsAlias
      QueueName: !Ref QueueName
      BucketName: !Ref BucketName
      StreamName: !Ref StreamName
      WebAclName: !Ref WebAclName
      WebAclScope: !Ref WebAclScope
      LogGroupName: !Ref LogGroupName
      SourceBucketName: !Ref SourceBucketName
      TargetBucketName: !Ref TargetBucketName
      TargetPrefix: !Ref TargetPrefix
      LoadBalancerArn: !Ref LoadBalancerArn

Outputs:
  ServiceToken:
    Description: Reuse this from other stacks as the ServiceToken of a Custom::AbstractHelper resource.
    Value: !GetAtt HelperFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ServiceToken"
  KmsKeyArn:
    Condition: OpResolveKms
    Value: !GetAtt HelperOperation.Arn
  QueueUrl:
    Condition: OpResolveQueue
    Value: !GetAtt HelperOperation.QueueUrl
  QueueArn:
    Condition: OpResolveQueue
    Value: !GetAtt HelperOperation.QueueArn
  ValidatedBucket:
    Condition: OpValidateBucket
    Value: !GetAtt HelperOperation.BucketName
  StreamArn:
    Condition: OpResolveStream
    Value: !GetAtt HelperOperation.StreamArn
  WebAclArn:
    Condition: OpResolveWebAcl
    Value: !GetAtt HelperOperation.Arn
