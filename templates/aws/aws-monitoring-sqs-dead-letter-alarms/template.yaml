Outputs:
  AlarmTopicArn:
    Description: The SNS topic every dead-letter alarm publishes to. Subscribe a pager, chat webhook or ticketing integration here.
    Value: !Ref AlarmTopic
  WatchedQueues:
    Description: The queue names you passed. Only the first ten have an alarm; deploy.sh refuses more than ten, and a second stack covers the rest.
    Value: !Join [",", !Ref DeadLetterQueueNames]
