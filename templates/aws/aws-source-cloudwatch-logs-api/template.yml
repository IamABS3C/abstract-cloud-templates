id: aws-source-cloudwatch-logs-api
title: CloudWatch Logs by API
cloud: aws
role: source
scope: account
summary: 'CloudWatch Logs is an API-poll source with no bucket or queue: Abstract reads log events directly. This
  template creates only the cross-account identity Abstract uses, scoped to one log group or to every log group
  in the account and region.'
formats:
- cloudformation
- launch-stack
- script
permissions:
- role: Create IAM roles and users
  where: The target AWS account
  why: 'Deployer: The template creates the identity Abstract uses.'
- role: logs:DescribeLogGroups, logs:DescribeLogStreams
  where: All log groups (Describe needs *)
  why: 'Abstract role: Enumerate groups and streams.'
- role: logs:GetLogEvents, logs:FilterLogEvents, logs:GetLogRecord, logs:StartQuery, logs:StopQuery, logs:GetQueryResults
  where: The named log group when ScopeToSingleGroup=true, otherwise every log group in the account and region
  why: 'Abstract role: Read the log events.'
- role: kms:Decrypt, kms:DescribeKey
  where: The KMS key, only when KmsKeyArn is supplied
  why: 'Abstract role: Read log groups encrypted with a customer-managed key.'
creates:
- An IAM role <NamePrefix>-role Abstract assumes with the External ID (AssumeRole), or an IAM user and access key
  (AccessKey)
- Optional Secrets Manager secret holding the access key instead of a stack output (StoreCredentialsInSecretsManager)
- Optional SSM parameter publishing the role ARN (ExportToSsm)
never_touches:
- 'Log groups, subscription filters or retention settings: the template declares only IAM, Secrets Manager and SSM
  resources (derived from declared resources)'
prerequisites:
- AWS CLI v2, authenticated, and jq for deploy.sh
- The Abstract principal ARN (or account ID) and External ID for your tenant
- The log group name, if access is to be scoped to one group
- The KMS key ARN, if the log groups use a customer-managed key
parameters:
- name: NamePrefix
  type: string
  required: false
  description: Prefix for created IAM resource names.
  default: abstract-cwl
- name: AuthMode
  type: string
  required: false
  description: AssumeRole (recommended) or AccessKey (long-lived user + key).
  default: AssumeRole
  allowed:
  - AssumeRole
  - AccessKey
- name: AbstractPrincipalArn
  type: string
  required: false
  description: Required for AssumeRole. Full IAM ARN or bare 12-digit account ID. Abstract supplies this and it
    is PER-TENANT — copy it from the integration in the Abstract console. Note the console regenerates the External
    ID on each pass, so mint it once and give the SAME value to whoever deploys the role.
  default: ''
  find_it: 'Abstract console: the AWS integration''s role step shows the principal and the External ID'
- name: ExternalId
  type: securestring
  required: false
  description: Required for AssumeRole. Shared secret enforced on sts:AssumeRole. Abstract supplies this and it
    is PER-TENANT — copy it from the integration in the Abstract console. Note the console regenerates the External
    ID on each pass, so mint it once and give the SAME value to whoever deploys the role.
  find_it: 'Abstract console: the AWS integration''s role step shows the principal and the External ID'
- name: MaxSessionDurationSeconds
  type: int
  required: false
  description: Maximum duration of an assumed-role session, in seconds.
  default: 3600
- name: PermissionsBoundaryArn
  type: string
  required: false
  description: 'Only if your account mandates a permissions boundary on every role. Find it with: aws iam list-policies
    --scope Local --query Policies[].Arn'
  default: ''
  find_it: aws iam list-policies --scope Local --query Policies[].Arn
- name: StoreCredentialsInSecretsManager
  type: string
  required: false
  description: For AccessKey mode, store the key in Secrets Manager instead of stack outputs.
  default: 'false'
  allowed:
  - 'true'
  - 'false'
- name: ExportToSsm
  type: string
  required: false
  description: Publish the role ARN to SSM Parameter Store under /NamePrefix/cloudwatch-logs/role-arn for later
    lookup.
  default: 'false'
  allowed:
  - 'true'
  - 'false'
- name: LogGroupName
  type: string
  required: false
  description: 'Optional log group name to scope access to (e.g. /aws/lambda/my-fn). Blank = all log groups in this
    account/region. Find it with: aws logs describe-log-groups --query logGroups[].logGroupName'
  default: ''
  find_it: aws logs describe-log-groups --query logGroups[].logGroupName
- name: ScopeToSingleGroup
  type: string
  required: false
  description: If true and a LogGroupName is given, restrict permissions to that one group (and its streams). If
    false, grants read across all groups (Describe needs *).
  default: 'false'
  allowed:
  - 'true'
  - 'false'
- name: KmsKeyArn
  type: string
  required: false
  description: 'Supply if the log group(s) are encrypted with a customer-managed KMS key. Find it with: aws kms
    list-aliases'
  default: ''
  find_it: aws kms list-aliases
outputs:
- AuthModeOut
- AwsRegion
- RoleArn
- AccessKeyId
- SecretAccessKey
- CredentialsSecretArn
abstract:
  integration: cloudwatch_logs
verify:
- check: The role ARN and region are available for the Abstract integration
  command: aws cloudformation describe-stacks --stack-name abstract-cloudwatchlogs --query 'Stacks[0].Outputs' --output
    table
  healthy: RoleArn and AwsRegion are present.
- check: Abstract can assume the role and read
  healthy: The integration saves and reads without an access error; on failure verify RoleArn and ExternalId, and
    the KMS grant for encrypted groups.
when_to_use: Logs live in CloudWatch Logs and Abstract should read them by API, with no bucket or queue in between.
when_not_to_use: High-volume log groups, where an S3 export or a subscription to Kinesis is cheaper than API polling.
live_test: canary
