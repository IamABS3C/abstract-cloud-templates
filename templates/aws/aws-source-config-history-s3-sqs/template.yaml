AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Abstract Security - AWS Config history to Abstract. Creates a hardened bucket AWS
  Config may deliver to, the SQS queue it notifies for each configuration history file,
  the role Abstract assumes to read them and, only when you opt in, the account's AWS
  Config delivery channel. Not yet deployed by Abstract; canary pending.

Metadata:
  # Where each setting comes from. AWS documentation wins over the Launchpad data
  # where they disagree (recorded in the comment beside the setting).
  Sources:
    - https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-policy.html
      # config.amazonaws.com: GetBucketAcl and ListBucket on the bucket, PutObject on
      # AWSLogs/<account>/Config/* with bucket-owner-full-control, all on aws:SourceAccount.
    - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-config-deliverychannel.html
      # One delivery channel per Region per account, and a configuration recorder must exist
      # first, so the channel is opt-in. No snapshot delivery is configured: a snapshot is sent
      # only when asked for, so the stream is configuration history.
    - https://docs.aws.amazon.com/config/latest/developerguide/view-configuration-snapshot.html
      # AWS Config writes an empty ConfigWritabilityCheckFile into the bucket; the notification
      # filters on .json.gz so that file never reaches Abstract.
    - https://docs.aws.amazon.com/config/latest/developerguide/how-does-config-work.html
      # History files every six hours per resource type, JSON with a configurationItems array.
    - tools/launchpad/data/scenarios.json aws-config-generic (dataformat json, json_key configurationItems)
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Naming" }
        Parameters: [NamePrefix]
      - Label: { default: "Abstract identity (provided by Abstract)" }
        Parameters: [AbstractPrincipalArn, ExternalId]
      - Label: { default: "AWS Config" }
        Parameters: [CreateDeliveryChannel]
      - Label: { default: "Bucket and queue" }
        Parameters: [LogRetentionDays, QueueVisibilityTimeoutSeconds, DlqMaxReceiveCount]
      - Label: { default: "Hardening (optional)" }
        Parameters: [PermissionsBoundaryArn, MaxSessionDurationSeconds]

Parameters:
  NamePrefix:
    Type: String
    Default: abstract
    Description: Prefix for created resource names. Lowercase, because it is part of the bucket name.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,18}[a-z0-9]$"
    ConstraintDescription: Lowercase letters, digits and hyphens, 3-20 chars.

  AbstractPrincipalArn:
    Type: String
    Default: ""
    Description: >-
      The principal Abstract provides. Accepts a full IAM role/user/root ARN or a bare
      12-digit account id (expanded to arn:aws:iam::<acct>:root).
    AllowedPattern: "^$|^[0-9]{12}$|^arn:aws[a-z-]*:iam::[0-9]{12}:(root|(role|user)/.+)$"
    ConstraintDescription: Provide a 12-digit account id or a valid IAM ARN.

  ExternalId:
    Type: String
    Default: ""
    NoEcho: true
    Description: "External ID provided by Abstract, enforced on sts:AssumeRole. It is PER-TENANT: copy it from the integration in the Abstract console, once, and give the same value to whoever deploys the role."
    MinLength: 0
    MaxLength: 1224

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: "Optional IAM permissions-boundary policy ARN attached to every role the stack creates. Find it with: aws iam list-policies --scope Local --query Policies[].Arn"
    AllowedPattern: "^$|^arn:aws[a-z-]*:iam::[0-9]{12}:policy/.+$"

  MaxSessionDurationSeconds:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200
    Description: Maximum duration of Abstract's assumed session (3600-43200 seconds, the range IAM accepts for a role).

  LogRetentionDays:
    Type: Number
    Default: 365
    MinValue: 0
    MaxValue: 3650
    Description: Days to keep log objects in the bucket before they expire (0 = keep forever).

  QueueVisibilityTimeoutSeconds:
    Type: Number
    Default: 900
    MinValue: 30
    MaxValue: 43200
    Description: Visibility timeout of the notification queue(s); longer than Abstract takes to process one object.

  DlqMaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000
    Description: Receives before a notification moves to the dead-letter queue. 5 surfaces a permanent failure within minutes.

  CreateDeliveryChannel:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      true creates this Region's AWS Config delivery channel pointing at the new bucket.
      Only when the account has a configuration recorder and NO delivery channel yet; an
      account has one per Region. Leave false to repoint an existing channel yourself.

Rules:
  RequireIdentity:
    Assertions:
      - Assert: !Not [!Equals [!Ref AbstractPrincipalArn, ""]]
        AssertDescription: AbstractPrincipalArn is required (provided by Abstract).
      - Assert: !Not [!Equals [!Ref ExternalId, ""]]
        AssertDescription: ExternalId is required (provided by Abstract).

Conditions:
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  ExpireLogs: !Not [!Equals [!Ref LogRetentionDays, 0]]
  # An ARN contains ":" so Split returns "arn" as element 0; a bare account id has no ":".
  PrincipalIsBareAccount: !Equals
    - !Select [0, !Split [":", !Ref AbstractPrincipalArn]]
    - !Ref AbstractPrincipalArn
  MakeChannel: !Equals [!Ref CreateDeliveryChannel, "true"]

Resources:
  LogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: [HistoryQueuePolicy]
    Properties:
      BucketName: !Sub "${NamePrefix}-config-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-current
            Status: !If [ExpireLogs, Enabled, Disabled]
            ExpirationInDays: !If [ExpireLogs, !Ref LogRetentionDays, 3650]
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt HistoryQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: !Sub "AWSLogs/${AWS::AccountId}/Config/"
                  - Name: suffix
                    Value: .json.gz
      Tags:
        - { Key: Purpose, Value: AbstractSecurity }
        - { Key: Source, Value: AWSConfig }
        - { Key: ManagedBy, Value: CloudFormation }

  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt LogBucket.Arn, !Sub "${LogBucket.Arn}/*"]
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AWSConfigBucketPermissionsCheck
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt LogBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AWSConfigBucketExistenceCheck
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt LogBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AWSConfigBucketDelivery
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${LogBucket.Arn}/AWSLogs/${AWS::AccountId}/Config/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount: !Ref AWS::AccountId

  HistoryDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${NamePrefix}-config-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - { Key: Purpose, Value: AbstractSecurity }

  HistoryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${NamePrefix}-config-queue"
      VisibilityTimeout: !Ref QueueVisibilityTimeoutSeconds
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt HistoryDeadLetterQueue.Arn
        maxReceiveCount: !Ref DlqMaxReceiveCount
      Tags:
        - { Key: Purpose, Value: AbstractSecurity }

  HistoryQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref HistoryQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt HistoryQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowS3Notify
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt HistoryQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::${NamePrefix}-config-${AWS::AccountId}-${AWS::Region}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  DeliveryChannel:
    Type: AWS::Config::DeliveryChannel
    Condition: MakeChannel
    DependsOn: [LogBucketPolicy]
    Properties:
      S3BucketName: !Ref LogBucket

  AbstractIngestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-config-role"
      Description: Role assumed by Abstract Security to read log objects and consume their notifications.
      MaxSessionDuration: !Ref MaxSessionDurationSeconds
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !If
                - PrincipalIsBareAccount
                - !Sub "arn:${AWS::Partition}:iam::${AbstractPrincipalArn}:root"
                - !Ref AbstractPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: read-s3-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListLogBucket
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt LogBucket.Arn
              - Sid: ReadLogObjects
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "${LogBucket.Arn}/AWSLogs/${AWS::AccountId}/Config/*"
        - PolicyName: consume-sqs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ConsumeQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource:
                  - !GetAtt HistoryQueue.Arn
      Tags:
        - { Key: Purpose, Value: AbstractSecurity }
        - { Key: ManagedBy, Value: CloudFormation }

Outputs:
  AwsRegion:
    Description: The Region -> the Abstract integration's region field.
    Value: !Ref AWS::Region
  BucketNameOut:
    Description: Log bucket -> the Abstract integration's S3 bucket field.
    Value: !Ref LogBucket
  RoleArn:
    Description: Role ARN -> the Abstract integration's Assume Role ARN.
    Value: !GetAtt AbstractIngestRole.Arn

  SqsQueueUrl:
    Description: Config history queue URL -> the Abstract integration's SQS queue URL.
    Value: !Ref HistoryQueue
  SqsQueueArn:
    Description: Config history queue ARN -> the Abstract integration's SQS queue ARN.
    Value: !GetAtt HistoryQueue.Arn
  SqsDeadLetterQueueUrl:
    Description: Config history dead-letter queue URL; watch it with aws-monitoring-sqs-dead-letter-alarms.
    Value: !Ref HistoryDeadLetterQueue
