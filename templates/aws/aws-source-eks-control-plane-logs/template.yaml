AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Abstract Security - EKS control-plane logs to Abstract. Subscribes your cluster's
  CloudWatch log group to a Firehose delivery stream that decompresses the records and
  writes one log line per line to a new hardened bucket, the SQS queue the bucket
  notifies and the role Abstract assumes to read them. Not yet deployed by Abstract;
  canary pending.

Metadata:
  # Where each setting comes from. AWS documentation wins over the Launchpad data
  # where they disagree (recorded in the comment beside the setting).
  Sources:
    - https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html
      # Control-plane logs go to the log group /aws/eks/<cluster>/cluster, and only once you
      # turn the log types on for the cluster; this template does not change the cluster.
    - https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/SubscriptionFilters.html
      # The role CloudWatch Logs assumes to write to Firehose: trust logs.amazonaws.com,
      # conditioned on aws:SourceArn in this account and Region. A log group takes only a few
      # subscription filters (CloudWatch Logs quotas), so this one counts against that limit.
    - https://docs.aws.amazon.com/firehose/latest/dev/Message_extraction.html
      # CloudWatch Logs sends gzipped DATA_MESSAGE envelopes. Decompression plus message
      # extraction delivers only the log lines; AppendDelimiterToRecord ends each record with
      # a newline so batches do not fuse. EKS audit lines are JSON, so dataformat nd works.
      # Extraction drops the envelope's logGroup and logStream; the prefix names the cluster.
    - https://docs.aws.amazon.com/firehose/latest/dev/controlling-access.html#using-iam-s3
    - tools/launchpad/data/scenarios.json eks-control-plane-logs and cloudwatch-logs-firehose-s3 (the five decode settings)
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Naming" }
        Parameters: [NamePrefix]
      - Label: { default: "Abstract identity (provided by Abstract)" }
        Parameters: [AbstractPrincipalArn, ExternalId]
      - Label: { default: "EKS" }
        Parameters: [ClusterName, FilterPattern]
      - Label: { default: "Firehose" }
        Parameters: [BufferIntervalSeconds, BufferSizeMB]
      - Label: { default: "Bucket and queue" }
        Parameters: [LogRetentionDays, QueueVisibilityTimeoutSeconds, DlqMaxReceiveCount]
      - Label: { default: "Hardening (optional)" }
        Parameters: [PermissionsBoundaryArn, MaxSessionDurationSeconds]

Parameters:
  NamePrefix:
    Type: String
    Default: abstract
    Description: Prefix for created resource names. Lowercase, because it is part of the bucket name.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,18}[a-z0-9]$"
    ConstraintDescription: Lowercase letters, digits and hyphens, 3-20 chars.

  AbstractPrincipalArn:
    Type: String
    Default: ""
    Description: >-
      The principal Abstract provides. Accepts a full IAM role/user/root ARN or a bare
      12-digit account id (expanded to arn:aws:iam::<acct>:root).
    AllowedPattern: "^$|^[0-9]{12}$|^arn:aws[a-z-]*:iam::[0-9]{12}:(root|(role|user)/.+)$"
    ConstraintDescription: Provide a 12-digit account id or a valid IAM ARN.

  ExternalId:
    Type: String
    Default: ""
    NoEcho: true
    Description: "External ID provided by Abstract, enforced on sts:AssumeRole. It is PER-TENANT: copy it from the integration in the Abstract console, once, and give the same value to whoever deploys the role."
    MinLength: 0
    MaxLength: 1224

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: "Optional IAM permissions-boundary policy ARN attached to every role the stack creates. Find it with: aws iam list-policies --scope Local --query Policies[].Arn"
    AllowedPattern: "^$|^arn:aws[a-z-]*:iam::[0-9]{12}:policy/.+$"

  MaxSessionDurationSeconds:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200
    Description: Maximum duration of Abstract's assumed session (3600-43200 seconds, the range IAM accepts for a role).

  LogRetentionDays:
    Type: Number
    Default: 365
    MinValue: 0
    MaxValue: 3650
    Description: Days to keep log objects in the bucket before they expire (0 = keep forever).

  QueueVisibilityTimeoutSeconds:
    Type: Number
    Default: 900
    MinValue: 30
    MaxValue: 43200
    Description: Visibility timeout of the notification queue(s); longer than Abstract takes to process one object.

  DlqMaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000
    Description: Receives before a notification moves to the dead-letter queue. 5 surfaces a permanent failure within minutes.

  BufferIntervalSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 900
    Description: Firehose writes an object at least this often (60-900 s). Longer means fewer, larger objects.

  BufferSizeMB:
    Type: Number
    Default: 64
    MinValue: 1
    MaxValue: 128
    Description: Firehose writes an object when this much data is buffered (1-128 MB), whichever comes first.

  ClusterName:
    Type: String
    Description: "Name of your EKS cluster. Its log group /aws/eks/<name>/cluster must already exist. Find it with: aws eks list-clusters"
    AllowedPattern: "^$|^[0-9A-Za-z][A-Za-z0-9_-]{0,99}$"

  FilterPattern:
    Type: String
    Default: ""
    Description: >-
      CloudWatch Logs filter pattern applied before Firehose bills anything. Empty sends
      every line. The group mixes JSON audit lines with plain-text lines, and a JSON
      pattern such as { $.verb != "get" } drops every plain-text line; use one only if
      you send audit logs alone.

Rules:
  RequireIdentity:
    Assertions:
      - Assert: !Not [!Equals [!Ref AbstractPrincipalArn, ""]]
        AssertDescription: AbstractPrincipalArn is required (provided by Abstract).
      - Assert: !Not [!Equals [!Ref ExternalId, ""]]
        AssertDescription: ExternalId is required (provided by Abstract).
  RequireCluster:
    Assertions:
      - Assert: !Not [!Equals [!Ref ClusterName, ""]]
        AssertDescription: ClusterName is required.

Conditions:
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  ExpireLogs: !Not [!Equals [!Ref LogRetentionDays, 0]]
  # An ARN contains ":" so Split returns "arn" as element 0; a bare account id has no ":".
  PrincipalIsBareAccount: !Equals
    - !Select [0, !Split [":", !Ref AbstractPrincipalArn]]
    - !Ref AbstractPrincipalArn

Resources:
  LogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: [LogsQueuePolicy]
    Properties:
      BucketName: !Sub "${NamePrefix}-eks-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-current
            Status: !If [ExpireLogs, Enabled, Disabled]
            ExpirationInDays: !If [ExpireLogs, !Ref LogRetentionDays, 3650]
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt LogsQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: !Sub "eks/${ClusterName}/"
      Tags:
        - { Key: Purpose, Value: AbstractSecurity }
        - { Key: Source, Value: EKS }
        - { Key: ManagedBy, Value: CloudFormation }

  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt LogBucket.Arn, !Sub "${LogBucket.Arn}/*"]
            Condition:
              Bool:
                aws:SecureTransport: "false"

  LogsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${NamePrefix}-eks-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - { Key: Purpose, Value: AbstractSecurity }

  LogsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${NamePrefix}-eks-queue"
      VisibilityTimeout: !Ref QueueVisibilityTimeoutSeconds
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt LogsDeadLetterQueue.Arn
        maxReceiveCount: !Ref DlqMaxReceiveCount
      Tags:
        - { Key: Purpose, Value: AbstractSecurity }

  LogsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref LogsQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt LogsQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowS3Notify
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt LogsQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::${NamePrefix}-eks-${AWS::AccountId}-${AWS::Region}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  FirehoseDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets Amazon Data Firehose write this stack's delivery stream into the log bucket.
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref AWS::AccountId
      Policies:
        - PolicyName: firehose-write-s3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BucketLevel
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket, s3:ListBucketMultipartUploads]
                Resource: !GetAtt LogBucket.Arn
              - Sid: ObjectLevel
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:AbortMultipartUpload]
                Resource:
                  - !Sub "${LogBucket.Arn}/eks/*"
                  - !Sub "${LogBucket.Arn}/firehose-errors/eks/*"
      Tags:
        - { Key: Purpose, Value: AbstractSecurity }

  DeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub "${NamePrefix}-eks"
      DeliveryStreamType: DirectPut
      DeliveryStreamEncryptionConfigurationInput:
        KeyType: AWS_OWNED_CMK
      ExtendedS3DestinationConfiguration:
        BucketARN: !GetAtt LogBucket.Arn
        RoleARN: !GetAtt FirehoseDeliveryRole.Arn
        Prefix: !Sub "eks/${ClusterName}/"
        ErrorOutputPrefix: firehose-errors/eks/
        CompressionFormat: UNCOMPRESSED
        BufferingHints:
          IntervalInSeconds: !Ref BufferIntervalSeconds
          SizeInMBs: !Ref BufferSizeMB
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Decompression
              Parameters:
                - ParameterName: CompressionFormat
                  ParameterValue: GZIP
            - Type: CloudWatchLogProcessing
              Parameters:
                - ParameterName: DataMessageExtraction
                  ParameterValue: "true"
            # No Delimiter parameter: the processor's default delimiter is a newline.
            - Type: AppendDelimiterToRecord
      Tags:
        - { Key: Purpose, Value: AbstractSecurity }

  LogsToFirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets CloudWatch Logs put the cluster's control-plane logs into this stack's delivery stream.
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: logs.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: put-to-firehose
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PutLogs
                Effect: Allow
                Action: [firehose:PutRecord, firehose:PutRecordBatch]
                Resource: !GetAtt DeliveryStream.Arn
      Tags:
        - { Key: Purpose, Value: AbstractSecurity }

  ControlPlaneSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      FilterName: !Sub "${NamePrefix}-eks-to-abstract"
      LogGroupName: !Sub "/aws/eks/${ClusterName}/cluster"
      FilterPattern: !Ref FilterPattern
      DestinationArn: !GetAtt DeliveryStream.Arn
      RoleArn: !GetAtt LogsToFirehoseRole.Arn

  AbstractIngestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-eks-role"
      Description: Role assumed by Abstract Security to read log objects and consume their notifications.
      MaxSessionDuration: !Ref MaxSessionDurationSeconds
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !If
                - PrincipalIsBareAccount
                - !Sub "arn:${AWS::Partition}:iam::${AbstractPrincipalArn}:root"
                - !Ref AbstractPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: read-s3-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListLogBucket
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt LogBucket.Arn
              - Sid: ReadLogObjects
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "${LogBucket.Arn}/eks/*"
        - PolicyName: consume-sqs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ConsumeQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource:
                  - !GetAtt LogsQueue.Arn
      Tags:
        - { Key: Purpose, Value: AbstractSecurity }
        - { Key: ManagedBy, Value: CloudFormation }

Outputs:
  AwsRegion:
    Description: The Region -> the Abstract integration's region field.
    Value: !Ref AWS::Region
  BucketNameOut:
    Description: Log bucket -> the Abstract integration's S3 bucket field.
    Value: !Ref LogBucket
  RoleArn:
    Description: Role ARN -> the Abstract integration's Assume Role ARN.
    Value: !GetAtt AbstractIngestRole.Arn

  SqsQueueUrl:
    Description: Control-plane logs queue URL -> the Abstract integration's SQS queue URL.
    Value: !Ref LogsQueue
  SqsQueueArn:
    Description: Control-plane logs queue ARN -> the Abstract integration's SQS queue ARN.
    Value: !GetAtt LogsQueue.Arn
  SqsDeadLetterQueueUrl:
    Description: Control-plane logs dead-letter queue URL; watch it with aws-monitoring-sqs-dead-letter-alarms.
    Value: !Ref LogsDeadLetterQueue
  DeliveryStreamName:
    Description: The Firehose delivery stream; its error objects land under firehose-errors/, which Abstract never reads.
    Value: !Ref DeliveryStream
