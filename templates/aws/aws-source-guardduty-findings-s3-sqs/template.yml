id: aws-source-guardduty-findings-s3-sqs
title: 'GuardDuty findings to Abstract: new key, bucket and queue'
cloud: aws
role: source
scope: account
summary: Creates the customer managed KMS key GuardDuty's S3 export requires, a hardened findings bucket, a publishing
  destination on your existing GuardDuty detector, the SQS queue the bucket notifies and the role Abstract assumes
  to read them. Not yet deployed by Abstract; canary pending.
formats:
- cloudformation
- script
permissions:
- role: Create IAM roles, KMS keys, S3 buckets, SQS queues and GuardDuty publishing destinations
  where: The target AWS account and Region
  why: 'Deployer: the stack creates the whole path; deploy.sh passes CAPABILITY_NAMED_IAM because it names the role.'
- role: kms:GenerateDataKey, conditioned on aws:SourceAccount and aws:SourceArn (your detector)
  where: The new KMS key (key policy)
  why: 'GuardDuty: encrypt each findings object it exports.'
- role: s3:GetBucketLocation, s3:PutObject, conditioned on aws:SourceAccount and aws:SourceArn (your detector)
  where: The findings bucket (bucket policy, which also denies any GuardDuty upload not encrypted under this key)
  why: 'GuardDuty: write findings objects.'
- role: sts:AssumeRole, conditioned on sts:ExternalId
  where: <NamePrefix>-guardduty-role
  why: 'Abstract: only the Abstract principal you supply can assume it, and only with the matching External ID.'
- role: s3:ListBucket, s3:GetBucketLocation, s3:GetObject
  where: The findings bucket
  why: 'Abstract: read the objects each notification points at.'
- role: sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes, sqs:GetQueueUrl
  where: The findings queue
  why: 'Abstract: consume the notifications.'
- role: kms:Decrypt, kms:DescribeKey
  where: The new KMS key
  why: 'Abstract: read the findings objects GuardDuty encrypted.'
creates:
- A customer managed KMS key with rotation, and an alias, retained when the stack is deleted
- 'A hardened findings bucket <NamePrefix>-guardduty-<account>-<region>: Block Public Access, ACLs disabled, HTTPS-only
  policy, versioning, lifecycle expiry, retained on stack delete'
- An SQS queue and a dead-letter queue (SSE-SQS, redrive after DlqMaxReceiveCount), notified for each new .jsonl.gz
  findings object
- 'A publishing destination on your existing detector (CreatePublishingDestination=true): this changes the detector''s
  findings export setting, and deleting the stack removes it'
- A cross-account IAM role <NamePrefix>-guardduty-role trusted only by the Abstract principal, with the External ID
never_touches:
- 'The detector''s other settings: its protection plans, suppression rules and finding-update frequency stay as they
  are'
- GuardDuty in other Regions and member accounts
prerequisites:
- AWS CLI v2, authenticated to the account and Region of the detector, and jq for deploy.sh
- GuardDuty enabled in this Region (the detector ID from aws guardduty list-detectors); for an organization, deploy
  in the delegated administrator account, whose detector exports findings for every member
- The Abstract principal ARN (or account ID) and External ID, from the GuardDuty integration in the Abstract console
- 'A detector exports to one S3 destination. If it already exports somewhere, set CreatePublishingDestination=false
  and repoint it yourself, or keep the old one'
- 'Optional but recommended: set the finding-update frequency to 15 minutes, or updated findings reach the bucket
  (and Abstract) up to 6 hours after the console: aws guardduty update-detector --detector-id <id> --finding-publishing-frequency
  FIFTEEN_MINUTES'
- 'AWS documents that GuardDuty does not create the folder it writes to. If creating the publishing destination fails
  on the bucket path, create it with aws s3api put-object --bucket <bucket> --key AWSLogs/<account>/GuardDuty/<region>/
  and update the stack; this is the first thing the canary checks'
parameters:
- name: NamePrefix
  type: string
  required: false
  description: Prefix for created resource names. Lowercase, because it is part of the bucket name.
  default: abstract
- name: AbstractPrincipalArn
  type: string
  required: false
  description: The principal Abstract provides. Accepts a full IAM role/user/root ARN or a bare 12-digit account id
    (expanded to arn:aws:iam::<acct>:root).
  default: ''
  find_it: 'Abstract console: the AWS integration''s role step shows the principal and the External ID'
  example: <AbstractPrincipalArn>
- name: ExternalId
  type: securestring
  required: false
  description: 'External ID provided by Abstract, enforced on sts:AssumeRole. It is PER-TENANT: copy it from the
    integration in the Abstract console, once, and give the same value to whoever deploys the role.'
  find_it: 'Abstract console: the AWS integration''s role step shows the principal and the External ID'
- name: PermissionsBoundaryArn
  type: string
  required: false
  description: 'Optional IAM permissions-boundary policy ARN attached to every role the stack creates. Find it with:
    aws iam list-policies --scope Local --query Policies[].Arn'
  default: ''
  find_it: aws iam list-policies --scope Local --query Policies[].Arn
- name: MaxSessionDurationSeconds
  type: int
  required: false
  description: Maximum duration of Abstract's assumed session (3600-43200 seconds, the range IAM accepts for a role).
  default: 3600
- name: LogRetentionDays
  type: int
  required: false
  description: Days to keep log objects in the bucket before they expire (0 = keep forever).
  default: 365
- name: QueueVisibilityTimeoutSeconds
  type: int
  required: false
  description: Visibility timeout of the notification queue(s); longer than Abstract takes to process one object.
  default: 900
- name: DlqMaxReceiveCount
  type: int
  required: false
  description: Receives before a notification moves to the dead-letter queue. 5 surfaces a permanent failure within
    minutes.
  default: 5
- name: DetectorId
  type: string
  required: true
  description: 'The ID of your existing GuardDuty detector in this Region. Find it with: aws guardduty list-detectors'
  find_it: aws guardduty list-detectors
- name: CreatePublishingDestination
  type: string
  required: false
  description: true points the detector's findings export at this bucket. Set false when the detector already exports
    somewhere you cannot change (a detector has one S3 destination), then point it here yourself.
  default: 'true'
  allowed:
  - 'true'
  - 'false'
- name: GuardDutyServicePrincipal
  type: string
  required: false
  description: The GuardDuty service principal. In an opt-in Region AWS documents the Regional form, for example
    guardduty.me-south-1.amazonaws.com.
  default: guardduty.amazonaws.com
outputs:
- AwsRegion
- BucketNameOut
- RoleArn
- SqsQueueUrl
- SqsQueueArn
- SqsDeadLetterQueueUrl
- KmsKeyArnOut
abstract:
  integration: guardduty
verify:
- check: The stack outputs carry the values the Abstract integration needs
  command: aws cloudformation describe-stacks --stack-name <stack-name> --query 'Stacks[0].Outputs' --output table
  healthy: RoleArn, SqsQueueUrl, SqsQueueArn, BucketNameOut and AwsRegion are present.
- check: The detector exports to the new bucket
  command: aws guardduty list-publishing-destinations --detector-id <detector-id>
  healthy: One S3 destination with Status PUBLISHING.
- check: Findings objects are arriving
  command: aws s3 ls s3://<bucket>/ --recursive | tail -5
  healthy: .jsonl.gz objects appear after the next export (generate sample findings with aws guardduty create-sample-findings
    --detector-id <detector-id> to test sooner).
- check: Nothing is failing into the dead-letter queue
  command: aws sqs get-queue-attributes --queue-url <dead-letter-queue-url> --attribute-names ApproximateNumberOfMessagesVisible
  healthy: Zero messages. Messages here usually mean the role cannot decrypt (check the key's root statement).
cost: One KMS key per month plus its requests, S3 storage and one SQS message per findings object; GuardDuty findings
  volume is small.
when_to_use: GuardDuty is on and you want its findings in Abstract, kept beyond GuardDuty's 90-day retention.
when_not_to_use: You already collect GuardDuty findings through Security Lake (aws-source-security-lake) or Security
  Hub; a second path would duplicate every finding.
cleanup_note: Deleting the stack removes the publishing destination, queues and role. The bucket and the KMS key are
  retained on purpose, because the bucket's findings are encrypted under that key; schedule the key's deletion only
  after the bucket is emptied and deleted.
live_test: static
