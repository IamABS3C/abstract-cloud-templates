id: azure-access-app-registration-logic-app
title: 'Abstract access to new subscriptions: app registrations by Logic App'
cloud: azure
role: access
scope: resource-group
summary: 'The recommended path for per-subscription app registrations: one Logic App in one resource group,
  running as one pre-consented identity, calls Microsoft Graph directly when a subscription is created
  or tagged. Same outcome as the policy path with one identity to audit, no per-subscription compute and
  a single run history.'
formats:
- bicep
- arm
- portal-ui
- script
depends_on: []
permissions:
- role: Global Administrator
  where: The Entra tenant
  why: 'Deployer: Once per tenant, to consent Application.ReadWrite.All and AppRoleAssignment.ReadWrite.All
    to the identity.'
- role: Microsoft Graph Application.ReadWrite.All and AppRoleAssignment.ReadWrite.All
  where: The Entra tenant
  why: 'Pre-consented managed identity: Creates apps and grants consent; tier-0 whichever path is used.'
- role: Key Vault Secrets Officer
  where: The central Key Vault
  why: 'Pre-consented managed identity: Stores each client secret.'
- role: Owner, or Contributor plus User Access Administrator
  where: Each target subscription
  why: 'Pre-consented managed identity: The workflow assigns RBAC there.'
creates:
- A Logic App (Consumption) workflow, default name abstract-appreg-onboarder, using the existing user-assigned
  identity
- An optional action group posting to a failure webhook (failureWebhookUrl)
- An optional Event Grid system topic for subscription events (enableEventTrigger, off by default); its
  event subscription is wired to the workflow callback URL by hand
- 'Per onboarded subscription, at run time: an Entra app Abstract-<subscription-id>, its service principal,
  verified Graph consent, a client secret in Key Vault, and Reader plus Azure Event Hubs Data Receiver
  on that subscription'
never_touches:
- Subscriptions that do not carry the tag gate, which are never onboarded
- Apps and service principals that this workflow did not create
- Other Entra ID configuration, users, groups and Conditional Access
- The managed identity and its Graph consent, which must already exist and are never created or changed here
- The Key Vault itself, which must already exist; only secrets are written to it
prerequisites:
- A user-assigned managed identity, created and consented once with ./deploy.sh bootstrap (Global Administrator)
- A central Key Vault that already exists
- Keep the tag gate (default abstract-onboard=true) so only opted-in subscriptions are onboarded
- Restrict Managed Identity Operator on the identity; it controls who can use it
parameters:
- name: location
  type: string
  required: false
  description: Region for the Logic App and Event Grid subscription.
  default: '[resourceGroup().location]'
- name: workflowName
  type: string
  required: false
  description: Name of the Logic App workflow.
  default: abstract-appreg-onboarder
- name: tags
  type: object
  required: false
  description: Tags applied to every resource created here.
  default: {}
- name: managedIdentityResourceId
  type: string
  required: true
  find_it: az identity list --query "[].id" -o tsv
  description: 'Resource ID of a user-assigned managed identity holding Graph Application.ReadWrite.All
    + AppRoleAssignment.ReadWrite.All (admin-consented). Create and consent it with ./deploy.sh bootstrap
    in this template folder. Treat as tier-0. Find it with: az identity list --query [].id -o tsv'
- name: managedIdentityClientId
  type: string
  required: false
  description: Client ID of that identity. Unused by the Logic App itself (it authenticates by resource
    ID) but recorded in outputs so the two paths stay interchangeable.
  default: ''
- name: keyVaultName
  type: string
  required: true
  find_it: az keyvault list --query "[].name" -o tsv
  description: 'Central Key Vault that receives every generated client secret. Must already exist; grant
    the identity Key Vault Secrets Officer on it. Find it with: az keyvault list --query [].name -o tsv'
- name: keyVaultInThisSubscription
  type: bool
  required: false
  description: Set false if the Key Vault lives in a different subscription - then supply keyVaultUri
    instead.
  default: true
- name: keyVaultUri
  type: string
  required: false
  description: Full vault URI (https://<name>.vault.azure.net/) when the vault is in another subscription.
  default: ''
- name: appNamePattern
  type: string
  required: false
  description: App display-name pattern. {sub} is replaced with the subscription ID. Also the idempotency
    key.
  default: Abstract-{sub}
- name: graphPermissions
  type: array
  required: false
  description: 'Microsoft Graph APPLICATION permissions requested for each app.


    VERIFIED against the live Graph service principal on 2026-08-03 (707 application

    appRoles). "Security.Read.All" is deliberately ABSENT - it exists as neither an

    application nor a delegated permission; coverage comes from SecurityEvents.Read.All

    plus SecurityAlert.Read.All and SecurityIncident.Read.All.

    '
  default:
  - AuditLog.Read.All
  - SecurityAlert.Read.All
  - SecurityEvents.Read.All
  - SecurityIncident.Read.All
  - Directory.Read.All
  - IdentityRiskEvent.Read.All
  - IdentityRiskyUser.Read.All
  - IdentityRiskyServicePrincipal.Read.All
  - ThreatHunting.Read.All
  - User.Read.All
  - Group.Read.All
  - Device.Read.All
- name: secretMonths
  type: int
  required: false
  description: Client-secret lifetime in months.
  default: 12
- name: subscriptionRoleDefinitionIds
  type: array
  required: false
  description: 'Azure RBAC roles granted to each service principal on ITS OWN subscription. This is the
    only real per-subscription boundary: Graph application permissions are inherently tenant-wide.'
  default:
  - acdd72a7-3385-48ef-bd42-f606fba81ae7
  - a638d3c7-ab3a-418d-83e6-5f17a39d4fde
- name: managementGroupId
  type: string
  required: false
  description: Management group whose subscription events are watched. Leave empty to watch the whole
    tenant root.
  default: ''
- name: tagName
  type: string
  required: false
  description: Only onboard subscriptions carrying this tag. STRONGLY recommended - without it every subscription
    that appears is onboarded. Empty means no gate.
  default: abstract-onboard
- name: tagValue
  type: string
  required: false
  description: Required tag value when tagName is set.
  default: 'true'
- name: enableEventTrigger
  type: bool
  required: false
  description: Create the Event Grid subscription for automatic triggering. Set false to deploy the workflow
    and drive it manually first - the safest way to start.
  default: false
- name: enableRenewal
  type: bool
  required: false
  description: Renew client secrets before they expire. A second workflow runs daily, finds this automation's
    secrets in the vault that expire within 30 days, and re-runs the onboarder for each subscription,
    which mints a new secret. Without it a secret is never renewed after the first onboarding.
  default: true
- name: failureWebhookUrl
  type: securestring
  required: false
  description: Optional webhook (Teams/Slack/ASTRO) that receives a message when an onboarding run fails
    or consent verification falls short.
outputs:
- workflowName
- renewalWorkflowName
- identityPrincipalId
- identityClientId
- triggerUrlHint
- nextSteps
verify:
- check: One subscription onboards end to end
  command: ./deploy.sh onboard -g rg-abstract-automation -s
    <subscription-id>
  healthy: The run succeeds; a consent shortfall returns HTTP 500 with the verified and expected counts
    and creates no secret.
- check: Consent is complete
  command: ./deploy.sh verify --app-id <app-id>
  healthy: No missing permissions are reported.
- check: Current state
  command: ../_modules/deploy-appreg.sh -a Status -g rg-abstract-automation
  healthy: Identity, consent, apps and secrets are listed as expected.
cost: No per-subscription compute and no per-run cost.
when_to_use: Per-subscription app registrations for Microsoft Graph or Microsoft 365 collection, unless
  governance mandates Azure Policy.
when_not_to_use: Event Hub collection, which needs no app registration.
live_test: static
lint_skip:
- check: 'arm-ttk:Password params must be secure'
  reason: False positive - secretMonths is a validity period in months whose name starts with secret, not a secret.
- check: 'arm-ttk:URIs Should Be Properly Constructed'
  reason: format() joins a validated host and a fixed path; uri() would re-normalise slashes and change the request sent to Key Vault and Graph.
