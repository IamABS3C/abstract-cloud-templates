id: azure-access-app-registration-management-group-policy
title: App registrations, by policy
cloud: azure
role: access
scope: management-group
summary: Azure Policy cannot create Entra objects, so this policy deploys a deployment script that runs
  as a pre-consented managed identity and calls Microsoft Graph. Each in-scope subscription gets its own
  app, credential and subscription-scoped RBAC. The event-driven automation path is safer for most customers.
formats:
- bicep
- arm
- portal-ui
- script
depends_on: []
permissions:
- role: Global Administrator or Privileged Role Administrator
  where: The Entra tenant
  why: 'Deployer: Once per tenant, to consent Application.ReadWrite.All and AppRoleAssignment.ReadWrite.All
    to the managed identity.'
- role: Microsoft Graph Application.ReadWrite.All and AppRoleAssignment.ReadWrite.All
  where: The Entra tenant
  why: 'Pre-consented managed identity: Creates the apps and grants their permissions; it can grant itself
    anything, so treat it as tier-0.'
- role: Owner, or Contributor plus User Access Administrator
  where: Each target subscription
  why: 'Policy assignment identity: The deployment script assigns RBAC there.'
- role: Key Vault Secrets Officer
  where: The central Key Vault
  why: 'Policy assignment identity: Stores each generated client secret.'
- role: Graph application permissions (AuditLog, security alerts, events and incidents, directory, identity
    risk, threat hunting, users, groups, devices)
  where: The Entra tenant
  why: 'Each created app: Graph application permissions are tenant-wide and cannot be scoped to a subscription.'
creates:
- A custom DeployIfNotExists policy definition and one assignment (<namePrefix>-appreg) with a system-assigned
  identity
- 'Per targeted subscription, on remediation: a resource group (default rg-abstract-appreg) hosting a
  deploymentScripts run, which creates a storage account and container instance'
- 'Per targeted subscription: an Entra app named Abstract-<subscription-id> and its service principal,
  reused by display name on re-runs'
- Admin consent for the configured Graph application permissions, verified by reading the assignments
  back
- A client secret stored only in the central Key Vault
- Reader and Azure Event Hubs Data Receiver on the app's own subscription
never_touches:
- Subscriptions that do not carry the tag gate, which are out of scope for the policy
- Apps and service principals that were not created by this policy; an existing app is only reused when
  its display name matches appNamePattern
- Other Entra ID configuration, users, groups and Conditional Access
- The managed identity and its Graph consent, which must already exist and are never created or changed here
prerequisites:
- A user-assigned managed identity already holding the two Graph permissions with admin consent
- A central Key Vault for every generated secret
- Microsoft.ContainerInstance and Microsoft.Storage registered in each target subscription
- A tag gate (default abstract-onboard=true) so only chosen subscriptions are onboarded
parameters:
- name: assignmentLocation
  type: string
  required: false
  description: Region for the policy assignment managed identity and the deploymentScript container.
  default: eastus
- name: namePrefix
  type: string
  required: false
  description: Prefix for the policy assignment name. Capped at 6 - management-group policy assignment
    names are limited to 24 characters.
  default: abs
- name: effect
  type: string
  required: false
  description: Policy effect. AuditIfNotExists reports which subscriptions LACK an Abstract app without
    creating anything - always start here.
  default: AuditIfNotExists
  allowed:
  - DeployIfNotExists
  - AuditIfNotExists
  - Disabled
- name: enforcementMode
  type: string
  required: false
  description: DoNotEnforce creates the assignment without acting. Combined with AuditIfNotExists this
    is a completely inert dry run.
  default: DoNotEnforce
  allowed:
  - Default
  - DoNotEnforce
- name: managedIdentityResourceId
  type: string
  required: true
  find_it: az identity list --query "[].id" -o tsv
  description: 'Resource ID of a user-assigned managed identity that ALREADY holds Microsoft Graph

    Application.ReadWrite.All and AppRoleAssignment.ReadWrite.All, consented by a

    Global Administrator. Policy cannot create or consent this - see scripts/

    Deploy-AbstractAppReg.sh -a Bootstrap for the one-time setup.


    This identity can grant itself any directory permission. Treat it as tier-0.


    Find it with: az identity list --query [].id -o tsv

    '
- name: managedIdentityClientId
  type: string
  required: true
  find_it: az identity list --query "[].clientId" -o tsv
  description: 'Client ID of that same identity. The script needs it for `az login --identity --username
    <clientId>`; the resource ID alone is not enough. Find it with: az identity list --query [].clientId
    -o tsv'
- name: centralKeyVaultName
  type: string
  required: true
  find_it: az keyvault list --query "[].name" -o tsv
  description: 'Name of a CENTRAL Key Vault that receives every generated client secret. Deliberately
    central: per-subscription vaults would scatter tier-0 secrets across the estate. Find it with: az
    keyvault list --query [].name -o tsv'
- name: centralKeyVaultResourceGroup
  type: string
  required: true
  find_it: az keyvault list --query "[].resourceGroup" -o tsv
  description: 'Resource group of the central Key Vault. Find it with: az group list --query [].name -o
    tsv'
- name: centralKeyVaultSubscriptionId
  type: string
  required: true
  find_it: az account list --query "[].id" -o tsv
  description: 'Subscription ID of the central Key Vault. Find it with: az account list --query [].id
    -o tsv'
- name: appNamePattern
  type: string
  required: false
  description: App display-name pattern. {sub} is replaced with the target subscription ID, giving one
    app per subscription. Also the idempotency key - the script reuses an app of the same name rather
    than creating a second one.
  default: Abstract-{sub}
- name: graphPermissions
  type: array
  required: false
  description: 'Microsoft Graph APPLICATION permissions granted to each created app.


    VERIFIED against the live Graph service principal on 2026-08-03. Note that

    "Security.Read.All" is NOT in this list and must never be added - it does not

    exist as an application permission (nor as a delegated scope); the real coverage

    is SecurityEvents.Read.All + SecurityAlert.Read.All + SecurityIncident.Read.All.

    '
  default:
  - AuditLog.Read.All
  - SecurityAlert.Read.All
  - SecurityEvents.Read.All
  - SecurityIncident.Read.All
  - Directory.Read.All
  - IdentityRiskEvent.Read.All
  - IdentityRiskyUser.Read.All
  - IdentityRiskyServicePrincipal.Read.All
  - ThreatHunting.Read.All
  - User.Read.All
  - Group.Read.All
  - Device.Read.All
- name: secretMonths
  type: int
  required: false
  description: Client-secret lifetime in months.
  default: 12
- name: subscriptionRoleDefinitionIds
  type: array
  required: false
  description: 'Azure RBAC roles granted to each created service principal ON ITS OWN SUBSCRIPTION. Default
    is Reader plus Azure Event Hubs Data Receiver. This - not the Graph permissions - is what makes the
    app per-subscription: Graph permissions are inherently tenant-wide.'
  default:
  - acdd72a7-3385-48ef-bd42-f606fba81ae7
  - a638d3c7-ab3a-418d-83e6-5f17a39d4fde
- name: scriptResourceGroup
  type: string
  required: false
  description: Resource group created in each target subscription to host the deploymentScript and its
    storage. Nothing sensitive lands here.
  default: rg-abstract-appreg
- name: azCliVersion
  type: string
  required: false
  description: az CLI version for the deploymentScript container.
  default: 2.60.0
- name: tagName
  type: string
  required: false
  description: 'Only act on subscriptions carrying this tag. STRONGLY recommended: it is the difference
    between "onboard what we chose" and "onboard everything the management group ever contains". Leave
    tagName empty to act on all in-scope subscriptions.'
  default: abstract-onboard
- name: tagValue
  type: string
  required: false
  description: Required tag value when tagName is set.
  default: 'true'
outputs:
- policyDefinitionId
- assignmentName
- assignmentPrincipalId
- nextSteps
verify:
- check: See which subscriptions would be onboarded before anything is created
  healthy: With effect AuditIfNotExists, Policy compliance lists exactly the subscriptions that lack an
    Abstract app.
- check: Consent is complete for a created app
  command: ./deploy.sh verify --app-id <app-id>
  healthy: No missing permissions are reported.
cost: Each remediation run creates a storage account and container instance in the target subscription
  and costs a few cents.
when_to_use: Only when governance mandates that every control arrive through Azure Policy.
when_not_to_use: Event Hub collection, which needs no app registration; and most estates, where the event-driven
  automation path keeps the privileged identity in one place.
live_test: static
lint_skip:
- check: 'arm-ttk:Parameter Types Should Be Consistent'
  reason: False positive - ARM-TTK compares the nested template's Integer spelling of secretMonths with the outer int.
- check: 'arm-ttk:Password params must be secure'
  reason: False positive - secretMonths is a validity period in months whose name starts with secret, not a secret.
- check: 'arm-ttk:Template Should Not Contain Blanks'
  reason: Optional array and object parameters default to [] and {}, which the Bicep compiler emits as blanks.
- check: 'arm-ttk:Variables Must Be Referenced'
  reason: dollar-fxv#0 is a compiler artefact of loadTextContent; scriptName is referenced inside the nested policy template, which ARM-TTK does not follow.
