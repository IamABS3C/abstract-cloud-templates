id: azure-destination-event-hub
title: 'Abstract to your Event Hub: namespace and hub'
cloud: azure
role: destination
scope: resource-group
summary: 'Provisions the Azure side of the Abstract Azure EventHub Destination: an Event Hubs namespace
  and one hub that Abstract delivers processed events into, with a Send-only SAS rule or an RBAC grant.
  Safe Mode keeps public access on so Abstract can always reach the hub during onboarding.'
formats:
- bicep
- arm
- portal-ui
- script
depends_on: []
permissions:
- role: Send on the abstract-send SAS rule
  where: The namespace
  why: 'Abstract: Least privilege for a producer; use its connection string in the destination modal.'
- role: Azure Event Hubs Data Sender
  where: The namespace, only when enableRbac=true
  why: 'Abstract: Deliver with a service principal instead of a connection string.'
creates:
- An Event Hubs namespace (Standard minimum, TLS 1.2, Auto-Inflate on)
- One destination hub (default abstract-destination-hub, 4 partitions, 7-day retention)
- A Send-only SAS rule abstract-send at namespace level (enableSas); keys are never emitted in outputs
- Optional Azure Event Hubs Data Sender for a service principal (enableRbac)
- Network rules, with an optional private endpoint and private DNS zone group
- Optional namespace diagnostic settings (enableDiagnostics)
never_touches:
- Existing Event Hubs namespaces, hubs and authorization rules, including RootManageSharedAccessKey
- Abstract's destination configuration (you enter the hub name and connection string there yourself)
- Workload resources in the resource group
prerequisites:
- A globally unique namespace name, 6 to 50 characters, starting with a letter
- Abstract egress must be able to reach the hub; with safeMode=false, include Abstract egress IPs in allowedIpRanges
- For RBAC delivery, the service principal's Enterprise Application object ID, not its client ID
parameters:
- name: location
  type: string
  required: false
  description: Azure region for all resources.
  default: '[resourceGroup().location]'
- name: namespaceName
  type: string
  required: true
  description: 'Event Hubs namespace name - globally unique, 6-50 chars, letters/numbers/hyphens, must
    start with a letter. Becomes <name>.servicebus.windows.net. You are CREATING this, so it is a name
    you choose - globally unique across Azure. Check with: az eventhubs namespace list --query [].name
    -o tsv'
  find_it: az eventhubs namespace exists --name <candidate-name> --query nameAvailable -o tsv
- name: sku
  type: string
  required: false
  description: Namespace pricing tier. Abstract requires Standard as the minimum tier.
  default: Standard
  allowed:
  - Standard
  - Premium
- name: capacity
  type: int
  required: false
  description: 'Throughput Units (Standard, 1-40) or Processing Units (Premium: 1, 2, 4, 8, 16).'
  default: 1
- name: autoInflate
  type: bool
  required: false
  description: Enable Auto-Inflate so the namespace scales Throughput Units automatically (Standard tier
    only).
  default: true
- name: maxThroughputUnits
  type: int
  required: false
  description: Auto-Inflate ceiling in Throughput Units (Standard only, max 40).
  default: 20
- name: minimumTlsVersion
  type: string
  required: false
  description: Minimum TLS version the namespace accepts.
  default: '1.2'
  allowed:
  - '1.0'
  - '1.1'
  - '1.2'
- name: tags
  type: object
  required: false
  description: Tags applied to every resource created by this template.
  default: {}
- name: eventHubName
  type: string
  required: false
  description: Name of the Event Hub that Abstract delivers events to. Enter this in the "EventHub Name"
    field of the Abstract destination integration.
  default: abstract-destination-hub
- name: partitionCount
  type: int
  required: false
  description: Partition count for the destination hub. Abstract docs recommend at least 4. Cannot be
    reduced after creation; max 32 on Standard.
  default: 4
- name: retentionDays
  type: int
  required: false
  description: Message retention in days. Size this to ride out delivery delays. Standard allows 1-7.
  default: 7
- name: enableSas
  type: bool
  required: false
  description: Create the Send-only SAS rule used for "EventHub Connection String" auth in the Abstract
    destination modal. When false, local (SAS) auth is fully DISABLED and only Entra ID / RBAC works.
  default: true
- name: sendRuleName
  type: string
  required: false
  description: Name of the least-privilege Send SAS rule created at namespace level. Use its primary connection
    string in the Abstract destination modal instead of RootManageSharedAccessKey.
  default: abstract-send
- name: enableRbac
  type: bool
  required: false
  description: Also assign Azure RBAC (Azure Event Hubs Data Sender) so Abstract can deliver events using
    a service principal / managed identity instead of a connection string.
  default: false
- name: principalId
  type: string
  required: false
  description: Object ID of the service principal Abstract authenticates as (the Enterprise Application
    object ID, NOT the app/client ID). Required only when enableRbac = true.
  default: ''
  find_it: az ad sp show --id <application-client-id> --query id -o tsv
- name: roleDefinitionName
  type: string
  required: false
  description: Built-in Event Hubs data-plane role granted to the principal. A destination only needs
    to SEND, so Data Sender is the least-privilege choice.
  default: Azure Event Hubs Data Sender
  allowed:
  - Azure Event Hubs Data Sender
  - Azure Event Hubs Data Owner
- name: principalType
  type: string
  required: false
  description: Type of the principal being granted RBAC (avoids PrincipalNotFound on freshly created SPNs).
  default: ServicePrincipal
  allowed:
  - ServicePrincipal
  - User
  - Group
- name: allowedIpRanges
  type: array
  required: false
  description: Public IP ranges (CIDR) allowed through the namespace firewall - Abstract egress IPs plus
    your admin ranges. A non-empty list flips the firewall default action to Deny (unless Safe Mode is
    on). Empty entries are filtered out.
  default: []
- name: allowAzureServices
  type: bool
  required: false
  description: Allow trusted Microsoft services through the firewall.
  default: true
- name: disablePublicNetwork
  type: bool
  required: false
  description: 'Disable ALL public network access on the namespace (Private Endpoint only). Only honored
    when safeMode = false. NOTE: blocks Abstract (external SaaS) unless it reaches the namespace privately.'
  default: false
- name: enablePrivateEndpoint
  type: bool
  required: false
  description: Create a Private Endpoint for the namespace.
  default: false
- name: subnetId
  type: string
  required: false
  description: Resource ID of the subnet that will host the Private Endpoint NIC.
  default: ''
- name: privateDnsZoneId
  type: string
  required: false
  description: Resource ID of the privatelink.servicebus.windows.net Private DNS zone (recommended with
    the Private Endpoint).
  default: ''
- name: safeMode
  type: bool
  required: false
  description: "Safe Mode guardrails for external SaaS delivery (Abstract):\n  true  -> public network\
    \ access stays ON, the IP allowlist is ignored, and the\n           firewall default action stays\
    \ Allow so Abstract can always deliver.\n  false -> disablePublicNetwork / allowedIpRanges are honored\
    \ exactly as set.\nShip customers safeMode=true for onboarding; harden later.\n"
  default: true
- name: enableDiagnostics
  type: bool
  required: false
  description: Enable diagnostic settings on the destination namespace so you can monitor the health of
    the delivery pipeline itself.
  default: false
- name: logAnalyticsWorkspaceId
  type: string
  required: false
  description: Resource ID of the Log Analytics workspace for namespace diagnostics.
  default: ''
- name: diagnosticsStorageAccountId
  type: string
  required: false
  description: Optional storage account resource ID for diagnostics archive.
  default: ''
outputs:
- namespaceName
- namespaceFqdn
- eventHubName
- sendRuleName
- publicAccess
- firewallDefaultAction
- safeModeEnabled
- rbacEnabled
- abstractDestinationOnboarding
verify:
- check: The destination fields are available
  command: az deployment group show -g <resource-group> -n <deployment-name> --query properties.outputs.abstractDestinationOnboarding.value
  healthy: eventHubName and the location of the Send-only connection string are listed.
live_test: static
lint_skip:
- check: 'arm-ttk:Template Should Not Contain Blanks'
  reason: An optional array parameter's empty default compiles to [], which ARM-TTK flags as a blank property.
