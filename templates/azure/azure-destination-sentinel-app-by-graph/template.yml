id: azure-destination-sentinel-app-by-graph
title: Sentinel destination, app by Graph
cloud: azure
role: destination
scope: resource-group
summary: "Creates the Entra app registration and service principal as the person deploying, using the Microsoft Graph Bicep extension, then calls the standard destination template. No managed identity has to exist first; optional secret automation adds one that owns only this app. CLI only: needs the Microsoft Graph Bicep extension (Azure CLI or PowerShell)."
formats:
- bicep
- script
depends_on:
- azure-destination-sentinel
- azure-access-key-vault-secrets-reader
permissions:
- role: Rights to register an app (the default user setting, or Application Developer)
  where: The Entra tenant
  why: 'Deployer: The app is created as the person deploying.'
- role: Owner, or Contributor plus User Access Administrator
  where: The resource group
  why: 'Deployer: Create the role assignments.'
- role: Privileged Role Administrator or Global Administrator
  where: The Entra tenant
  why: 'Deployer: Only with automateSecret, to grant the secret writer its Graph permission.'
- role: Microsoft Graph Application.ReadWrite.OwnedBy, and Key Vault Secrets Officer on the new vault
  where: This app and the new vault
  why: 'Secret writer identity: Adds and stores the secret; measured unable to change apps it does not
    own.'
- role: Monitoring Metrics Publisher
  where: The DCR only
  why: 'Abstract runtime app: All the Logs Ingestion API needs.'
creates:
- Everything the standard Sentinel destination creates, via the standard template as a module, with the
  new service principal as principalId
- An Entra app registration with no API permissions, tagged abstract:sentinel-destination; uniqueName
  keeps redeploys on the same app
- The app's service principal
- 'With automateSecret: a user-assigned identity abstract-sentinel-secret-writer that owns only this app,
  holding Graph Application.ReadWrite.OwnedBy'
- 'With automateSecret: a Key Vault for the client secret and a deployment script that creates and stores
  it'
never_touches:
- Microsoft Sentinel analytics rules, automation rules, hunting queries, bookmarks, incidents, watchlists,
  workbooks, data connectors, threat intelligence or settings
- Workspace functions, saved searches or parsers, including every ASIM parser
- Any table other than the Abstract table
- An existing workspace's SKU, retention, daily cap, access mode, network settings or workspace transformation
  DCR
- Any other DCR, DCE or diagnostic setting, unless it has the same name as one the template creates
prerequisites:
- Azure CLI or Azure PowerShell; there is no portal wizard for Microsoft Graph Bicep
- The bicepconfig.json that enables the Microsoft Graph extension, alongside the template
- Deploy in Incremental mode only
- Deleting the resource group does not delete the app registration
parameters:
- name: location
  type: string
  required: false
  description: Azure region for the DCE, DCR and (when automateSecret) the identity, Key Vault and script.
  default: '[resourceGroup().location]'
- name: tags
  type: object
  required: false
  description: Tags applied to every created Azure resource that supports tags.
  default: {}
- name: tagsByResource
  type: object
  required: false
  description: Resource-specific tags, keyed by fully qualified Azure resource type.
  default: {}
- name: appDisplayName
  type: string
  required: false
  description: Display name of the app registration Abstract signs in as.
  default: Abstract-Sentinel-Destination
- name: appUniqueName
  type: string
  required: false
  description: Tenant-wide unique key for the app registration (Microsoft Graph uniqueName). It makes
    redeploys update the same app instead of creating another. Immutable once the app exists.
  default: abstract-sentinel-destination
- name: automateSecret
  type: bool
  required: false
  description: 'Create the client secret automatically: adds a managed identity that owns only this app
    (Graph Application.ReadWrite.OwnedBy), a Key Vault and a deployment script. Needs a Privileged Role
    Administrator or Global Administrator deployer. Off: create the secret yourself afterwards (see the
    secretCommand output).'
  default: false
- name: keyVaultName
  type: string
  required: false
  description: Key Vault to create for the client secret (automateSecret only). Empty generates abskv-<hash>.
  default: ''
- name: secretName
  type: string
  required: false
  description: Name of the Key Vault secret that holds the client secret (automateSecret only).
  default: abstract-sentinel-client-secret
- name: secretValidityYears
  type: int
  required: false
  description: Client secret lifetime in years (automateSecret only).
  default: 1
  allowed:
  - 1
  - 2
- name: forceSecretRotation
  type: bool
  required: false
  description: Mint a new secret even if the stored one is still valid (automateSecret only).
  default: false
- name: secretReaderObjectId
  type: string
  required: false
  description: 'Object ID of a user or group that may read the secret from Key Vault (Key Vault Secrets
    User), so someone can paste it into Abstract (automateSecret only). Empty: grant it yourself; the
    deployer is not given access automatically.'
  default: ''
  find_it: az ad user show --id <user-principal-name> --query id -o tsv
- name: azCliVersion
  type: string
  required: false
  description: Azure CLI version for the deployment script (automateSecret only).
  default: 2.60.0
- name: createWorkspace
  type: bool
  required: false
  description: Create a new Log Analytics workspace. Set false to target an EXISTING workspace in THIS
    resource group.
  default: true
- name: workspaceName
  type: string
  required: false
  description: 'Workspace name. Creating: empty auto-generates abstract-sentinel-<hash>. Existing: the
    exact name (in this resource group).'
  default: ''
- name: existingWorkspaceLocation
  type: string
  required: false
  description: Region of the EXISTING workspace (Existing mode only). Empty = the deployment location.
  default: ''
- name: workspaceSku
  type: string
  required: false
  description: "Workspace pricing tier. PerGB2018 is the standard pay-as-you-go tier."
  default: PerGB2018
  allowed:
  - PerGB2018
  - CapacityReservation
  - Free
  - Standalone
  - PerNode
- name: workspaceRetentionDays
  type: int
  required: false
  description: Workspace retention in days. Only applied when creating a new workspace.
  default: 90
- name: enableSentinel
  type: bool
  required: false
  description: Enable Microsoft Sentinel on a new workspace.
  default: true
- name: dataCollectionEndpointName
  type: string
  required: false
  description: "Name of the Data Collection Endpoint (DCE) that receives data from Abstract."
  default: abstract-dce
- name: dataCollectionRuleName
  type: string
  required: false
  description: "Name of the Data Collection Rule (DCR) that routes data into the workspace table."
  default: abstract-dcr
- name: customTableName
  type: string
  required: false
  description: "Custom log table name. MUST end in _CL. Enter this (as the stream Custom-<table>) in the \"Log Stream Name\" field of the Abstract destination modal."
  default: AbstractEventLogs_CL
- name: customTableRetentionDays
  type: int
  required: false
  description: "Retention of the Abstract table in days. 0 (default) sends no retention, so an existing table keeps its retention and a new table uses the workspace default. A value shortens or lengthens the table's total retention; shortening deletes data older than the new value."
  default: 0
- name: customTablePlan
  type: string
  required: false
  description: "Table plan for the Abstract table. Keep (default) keeps the plan an existing table already has, and create a new table as Analytics: a redeploy then never changes a table's plan, or its cost, by accident. Analytics runs analytics rules and our content pack on it. Auxiliary is the Sentinel data lake tier: cheap long retention and KQL jobs, but no analytics rules or alerts. Basic sits between them. Setting a plan on an existing table switches it; Azure applies the new plan to the whole table."
  default: Keep
  allowed:
  - Keep
  - Analytics
  - Basic
  - Auxiliary
- name: enableDcrErrorLogs
  type: bool
  required: false
  description: "Send the Data Collection Rule's ingestion errors (rejected requests, malformed payloads, limit and transformation errors) to the DCRLogErrors table in the workspace. Without it, data Azure refuses or drops is invisible to the customer and to Abstract."
  default: true
- name: enableAsim
  type: bool
  required: false
  description: "Also write each event into Microsoft's ASIM normalized tables (ASimAuthenticationEventLogs and the others listed in asimSchemas), mapped from the Abstract Common Schema by solutions/asim. Off by default. Microsoft's built-in ASIM parsers read those tables, so once this is on every ASIM analytics rule, hunting query and workbook already running in the workspace also sees Abstract data: expect new alerts, duplicates where Microsoft's own connector collects the same vendor, and a second copy of each mapped event in billing. Turn it on in a staging workspace first, or one schema at a time with asimSchemas. Needs Microsoft Sentinel on the workspace and the generated Abstract schema (tableColumns left empty). Every event still also lands in the Abstract table."
  default: false
- name: asimSchemas
  type: array
  required: false
  description: "ASIM schemas to write, by name (for example ['Authentication', 'NetworkSession']). ['*'] (default) writes every schema solutions/asim maps; [] writes none."
  default:
  - '*'
- name: grantMonitoringContributor
  type: bool
  required: false
  description: "Also grant Monitoring Contributor on the DCR. Off by default: sending data through the Logs Ingestion API needs only Monitoring Metrics Publisher, and Monitoring Contributor would let a leaked Abstract credential rewrite or delete the DCR and its error-log setting. Turn on only if your Abstract destination setup specifically asks for it."
  default: false
outputs:
- clientId
- applicationTenantId
- servicePrincipalObjectId
- dataCollectionRuleImmutableId
- dataCollectionEndpointUrl
- logStreamName
- workspaceName
- clientSecretKeyVaultUri
- secretCommand
- secretWriterNote
verify:
- check: The outputs carry the three values the Abstract destination needs
  command: az deployment group show -g <resource-group> -n <deployment-name> --query properties.outputs
  healthy: dataCollectionRuleImmutableId, dataCollectionEndpointUrl and logStreamName (Custom-AbstractEventLogs_CL)
    are present.
- check: Events are landing in the Abstract table
  command: AbstractEventLogs_CL | where TimeGenerated > ago(1h) | summarize count() by vendor, product
  healthy: A count that matches the event count Abstract reports for the route.
- check: Azure is not rejecting rows
  command: DCRLogErrors | where TimeGenerated > ago(1h) | summarize count() by OperationName, Message
  healthy: No rows.
cost: Ingestion into the Abstract table is charged at the table's plan (Analytics by default), and ASIM,
  when on, adds a further copy of each mapped event. Retention beyond the free period is charged; DCE
  and DCR billing is not verified.
when_to_use: Production, when the template should create the app registration and no pre-existing privileged
  identity is acceptable.
when_not_to_use: Portal-only deployments; Microsoft Graph Bicep is documented only for Azure CLI and PowerShell.
live_test: static
