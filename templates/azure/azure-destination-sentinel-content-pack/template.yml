id: azure-destination-sentinel-content-pack
title: 'Sentinel content for Abstract data: rules and workbooks'
cloud: azure
role: destination
scope: resource-group
summary: A self-contained approximation of the Abstract Microsoft Sentinel solution that installs connector
  tiles, an ASIM parser function, analytics and automation rules, hunting queries, workbooks and playbooks
  into an existing Sentinel workspace. Sufficient for a lab or private install; not a substitute for the
  certified Content Hub package.
formats:
- arm
- portal-ui
- script
depends_on: []
permissions:
- role: Contributor
  where: The Sentinel workspace's resource group
  why: 'Deployer: Install the solution content, workbooks, playbooks and their API connections; Contributor
    includes Microsoft.Resources/deployments/*. The template creates no role assignments, so the playbook
    identities'' roles below are granted separately by someone with Owner or User Access Administrator.'
- role: Key Vault Secrets User
  where: The Key Vault secret holding the Abstract API key
  why: 'Each playbook''s managed identity: Playbooks fetch the key at runtime; the template never stores
    it.'
- role: Microsoft Sentinel Responder
  where: The workspace
  why: 'Each playbook''s managed identity: Playbooks comment on and update incidents.'
- role: Microsoft Sentinel Automation Contributor
  where: The resource group that holds the playbooks (this one)
  why: 'Microsoft Sentinel (the Azure Security Insights service principal): Lets the two run-playbook automation
    rules call the playbooks; without it the deploy fails with "Missing required permissions for Microsoft
    Sentinel on the playbook resource". Granting it needs Owner or User Access Administrator.'
creates:
- The solution package record (contentPackages) with linked metadata
- Two data connector definitions (connector tiles)
- The ASim_AbstractEvent parser function (saved search)
- 'Three hunting queries: Abstract_RareProduct, Abstract_HighRiskIdentities, Abstract_DailyValueSummary'
- Two scheduled analytics rules, installed disabled
- Three automation rules, installed disabled and scoped to this pack's two rules
- 'Two workbooks: Pipeline Overview and Value & ROI'
- 'Three playbooks as nested deployments: enrich, verdict and tune'
never_touches:
- Your own analytics rules, automation rules, workbooks and playbooks; it only adds its own items
- Incident status; the Verdict playbook comments and can raise severity, never closes
prerequisites:
- An existing Log Analytics workspace with Microsoft Sentinel enabled, where the Abstract table AbstractEventLogs_CL
  lives
- A Key Vault secret URI for the Abstract API key (keyVaultSecretUri)
- The Abstract API base URL and vendor account ID for the playbooks, or configure them later
- Review each rule and enable the ones you want; they install disabled
- 'Before the first deploy, someone with Owner or User Access Administrator on this resource group grants
  Microsoft Sentinel permission to run playbooks, then waits about 10 minutes for Azure to apply it (measured:
  a deploy one minute after the grant still failed): az role assignment create --assignee 98785600-1bb7-4fb9-b9fa-19afe2c8a360
  --role "Microsoft Sentinel Automation Contributor" --scope /subscriptions/SUBSCRIPTION_ID/resourceGroups/RESOURCE_GROUP
  (98785600-... is the application ID of Azure Security Insights, the same in every tenant)'
parameters:
- name: workspace
  type: string
  required: true
  description: Log Analytics / Sentinel workspace name.
  find_it: az monitor log-analytics workspace list --query "[].{name:name,location:location,resourceGroup:resourceGroup}" -o table
- name: workspaceLocation
  type: string
  required: false
  description: Region of the existing Sentinel workspace. Every content resource is created in it; it must match the workspace's region.
  default: '[resourceGroup().location]'
- name: customTableName
  type: string
  required: false
  description: Custom table the Abstract Sentinel Destination writes to.
  default: AbstractEventLogs_CL
- name: logoUrl
  type: string
  required: false
  description: Connector tile logo. Defaults to the embedded Abstract Security mark (self-contained data
    URI).
  default: data:image/svg+xml;base64,
- name: abstractBaseUrl
  type: string
  required: false
  description: Abstract API base URL (used by the playbooks).
  default: https://api.abstractsecurity.app
- name: abstractVendorAccountId
  type: string
  required: false
  description: Abstract vendor account id for the playbooks (x-as-vendor-account-id). Leave blank to configure
    later.
  default: ''
- name: keyVaultSecretUri
  type: string
  required: false
  description: Key Vault secret URI for the Abstract API key, for example https://<vault>.vault.azure.net/secrets/abstract-api-key.
    Playbooks fetch it at runtime through their managed identity (grant each 'Key Vault Secrets User').
    The key is never stored in the template. Leave empty to install the playbooks without it; they fail
    until it is set.
  default: ''
- name: lookbackHours
  type: int
  required: false
  description: Enrich-incident playbook lookback window (hours).
  default: 24
outputs: []
when_to_use: A lab or private install of the Abstract Sentinel content.
when_not_to_use: An official Content Hub or marketplace listing, which needs Microsoft's packaging and
  validation tooling run against the source.
live_test: static
lint_skip:
- check: 'arm-ttk:DeploymentTemplate Must Not Contain Hardcoded Uri'
  reason: The three hits are the managed-identity token audience https://vault.azure.net on each playbook's Key Vault call, which is the public-cloud Key Vault resource identifier and not a URL the template connects to.
- check: 'arm-ttk:IDs Should Be Derived From ResourceIDs'
  reason: Sentinel Content Hub package conventions, contentPackages packageId and contentId, metadata sourceId and parentId, and Logic App workflow expressions use literal ids that are not Azure resource ids.
- check: 'arm-ttk:Location Should Not Be Hardcoded'
  reason: Each playbook nested template deliberately places its Logic App and managed API connection in the resource group's region; threading a location parameter through three nested templates changes deployed behavior and this template is static-tested only.
- check: 'arm-ttk:Template Should Not Contain Blanks'
  reason: The empty values are required by the target schemas, runAfter {} and empty actions {} in the Logic App definitions, customParameterValues {} on the connection, and the empty groupByAlertDetails and groupByCustomDetails lists in the analytics rule incident configuration.
