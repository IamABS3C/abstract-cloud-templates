id: azure-destination-sentinel-solution
title: 'Abstract Security for Microsoft Sentinel: one-deploy solution'
cloud: azure
role: destination
scope: resource-group
summary: 'One Azure deployment sets up everything Abstract needs to deliver data into Microsoft Sentinel, and
  the Abstract content that uses it. The data plane is the Azure Sentinel Destination template, reused as a module:
  a new or existing workspace with Microsoft Sentinel, a Data Collection Endpoint, the AbstractEventLogs_CL table,
  a Data Collection Rule with Monitoring Metrics Publisher for the Abstract app on that rule only, and DCR error
  logging. On the same rule it adds the routes you choose: Microsoft''s ASim tables, a store-once option, a cheap
  Auxiliary lake table, and vendor-native tables filled with Microsoft''s own connector transformation (Okta into
  OktaV2_CL). The Content hub package Abstract Security for Microsoft Sentinel is installed with it: a data connector
  tile, the ASim_AbstractEvent parser, two analytics rules (disabled), three hunting queries, five workbooks, three
  playbooks and their automation rules. Every content item has its own switch.'
formats:
- bicep
- arm
- terraform
- portal-ui
- script
depends_on: []
permissions:
- role: Owner, or Contributor plus User Access Administrator
  where: The resource group
  why: 'Deployer: create the resources, the role assignment on the Data Collection Rule and, with keyVaultMode Create or
    Existing and grantPlaybookRoles, the playbooks'' role assignments. Contributor alone is enough when principalId is
    empty and no playbook role is granted.'
- role: Rights to register an app
  where: The Entra tenant
  why: 'Deployer: create the Abstract app registration beforehand (azure-destination-sentinel/scripts/new-app-registration.sh
    does it).'
- role: Monitoring Metrics Publisher
  where: The Data Collection Rule only
  why: 'Abstract runtime app: all the Logs Ingestion API needs. It cannot read data or change the rule. The deployment
    grants it when principalId is set.'
- role: Microsoft Sentinel Automation Contributor
  where: The resource group, for the Azure Security Insights service principal (app id 98785600-1bb7-4fb9-b9fa-19afe2c8a360)
  why: 'Only with deployPlaybookAutomationRules: lets Sentinel automation rules run the playbooks. Grant it about
    10 minutes before the deployment; the template does not grant it.'
- role: Key Vault Secrets User and Microsoft Sentinel Responder
  where: The API-key secret (not the vault), and the workspace
  why: 'Each playbook''s managed identity, only with deployPlaybooks: read the Abstract API key at run time and update
    incidents. The deployment grants both when it stores the key (keyVaultMode Create or Existing) and grantPlaybookRoles
    is on, which needs Owner or User Access Administrator on the resource group; with keyVaultMode None, grant them yourself.'
creates:
- A Log Analytics workspace with Microsoft Sentinel, only when createWorkspace=true
- The custom table AbstractEventLogs_CL, with one column per top-level key of the Abstract Common Schema event
- A Data Collection Endpoint (default abstract-dce) and a Data Collection Rule (default abstract-dcr) whose input
  stream Custom-AbstractEventLogs_CL is the stream Abstract sends to
- Monitoring Metrics Publisher on the Data Collection Rule for principalId, when it is set
- A diagnostic setting sending the rule's ingestion errors to DCRLogErrors (enableDcrErrorLogs, on by default)
- 'Optional routes on the same rule: one ASIM dataflow per schema in asimSchemas (enableAsim), the lake table on
  the Auxiliary plan (lakeTableName and lakeCategories), and one vendor-native or ASIM dataflow per entry in nativeVendors
  (okta and crowdstrike-hosts create their table if missing)'
- The Content hub package Abstract Security for Microsoft Sentinel (contentPackages, one contentTemplate per item,
  and metadata linking each installed item to the package)
- 'Behind its own switch each: the data connector tile, the ASim_AbstractEvent parser, the analytics rules High or
  Critical event, Repeated auth failures followed by success and Finding (all disabled), three hunting queries, the workbooks
  Pipeline Overview, Value & ROI and Sentinel Discovery, the playbooks Abstract-Enrich-Incident, Abstract-Verdict
  and Abstract-Tune-At-Source with their Sentinel API connection, and the automation rules (disabled)'
- 'Only with keyVaultMode Create or Existing: a Key Vault (Create: RBAC authorization, soft delete, purge protection),
  the secret keyVaultSecretName holding abstractApiKey, and with grantPlaybookRoles each playbook''s Key Vault Secrets
  User on that secret and Microsoft Sentinel Responder on the workspace'
never_touches:
- Analytics rules, automation rules, hunting queries, workbooks, playbooks and parsers that are not this solution's
- The SKU, retention, daily cap, access mode, network settings or workspace transformation DCR of an existing workspace
- Any table other than AbstractEventLogs_CL, the lake table and the vendor tables it creates
- Any other Data Collection Rule, Data Collection Endpoint or diagnostic setting, unless it has the same name as
  one the template creates
- Microsoft's own data connectors and their Content hub solutions; install the Okta Single Sign-On solution yourself
  to get its parsers and rules over OktaV2_CL
prerequisites:
- 'Terraform (the terraform/ folder): abstractApiKey is written in plain text to the Terraform state through the
  deployment''s parameters_content, so from Terraform use keyVaultMode None with keyVaultSecretUri pointing at a secret
  you created in Key Vault yourself (the existing-secret path), and keep the state encrypted and access-controlled.'
- An Entra app registration for Abstract. Pass its service principal object ID (not the client ID) as principalId,
  and keep its client ID, client secret and tenant ID for the Abstract destination.
- 'For an existing workspace: it must be in this resource group and already run Microsoft Sentinel, and the Data
  Collection Endpoint and Rule are created in its region (existingWorkspaceLocation).'
- Deploy in Incremental mode only. Complete mode would delete everything else in the resource group.
- 'A new workspace with enableAsim on can stop once with InvalidOutputTable: Microsoft Sentinel creates the ASim
  tables a minute or two after it is switched on. Deploy again with the same inputs (in the portal, open the failed
  deployment and select Redeploy). deploy.sh does this by itself: it waits 3 minutes and runs once more. A rerun
  changes nothing that already succeeded, and the rule keeps its immutable ID.'
- 'Azure allows 20 dataflows per Data Collection Rule. This rule uses 1 catch-all, 1 per ASIM schema (up to 8),
  1 for the lake and 1 per entry in nativeVendors, so 19 at most today. The template counts them before it changes
  anything and stops with "The Data Collection Rule would have N dataflows; Azure allows 20"; the output dataFlowCount
  reports the number deployed.'
- 'With deployPlaybookAutomationRules: grant Microsoft Sentinel Automation Contributor on this resource group to
  Azure Security Insights (98785600-1bb7-4fb9-b9fa-19afe2c8a360, the same app in every tenant) about 10 minutes before,
  or the deployment fails with "Missing required permissions for Microsoft Sentinel on the playbook resource".'
parameters:
- name: location
  type: string
  required: false
  description: 'Azure region of a new workspace, and of the Data Collection Endpoint and Rule. Change it only when
    the resource group''s region is not where the data should live; every Abstract resource must sit in the workspace''s
    region, and moving it later means a new workspace. Find it: Azure portal > Resource groups > your group > Overview
    > Location. Default: the resource group''s region. Example: eastus.'
  default: '[resourceGroup().location]'
  example: eastus
  find_it: az group show -n <resource-group> --query location -o tsv
- name: createWorkspace
  type: bool
  required: false
  description: 'true creates a Log Analytics workspace and switches Microsoft Sentinel on. Set false to use a workspace
    that already runs Sentinel in this resource group; nothing about that workspace (SKU, retention, daily cap, network)
    is changed. Find it: Azure portal > Microsoft Sentinel lists every workspace that runs Sentinel, with its resource
    group. Default: true. Example: false. A new workspace is a new billable resource; pointing Abstract at a second
    workspace splits your data.'
  default: true
  example: false
  find_it: az monitor log-analytics workspace list -g <resource-group> --query [].name -o tsv
- name: workspaceName
  type: string
  required: false
  description: 'Name of the workspace. New workspace: leave empty to generate abstract-sentinel-<hash>, or give a name
    of 4 to 63 letters, digits and hyphens. Existing workspace: its exact name, which must be in this resource group,
    or the deployment fails. Find it: Azure portal > Log Analytics workspaces > Name. Default: empty. Example: sentinel-prod.'
  default: ''
  example: sentinel-prod
  find_it: az monitor log-analytics workspace list -g <resource-group> --query [].name -o tsv
- name: workspaceRetentionDays
  type: int
  required: false
  description: 'Interactive retention of a new workspace, 7 to 730 days. Used only when createWorkspace is true; an
    existing workspace is never changed. Raise it when policy needs searchable data longer. Find the current value:
    Azure portal > Log Analytics workspaces > the workspace > Usage and estimated costs > Data retention. Default: 90.
    Example: 180. Microsoft Sentinel includes 90 days; each day above that is billed per GB retained.'
  default: 90
  example: 180
  find_it: 'az monitor log-analytics workspace show -g <resource-group> -n <workspace> --query retentionInDays -o tsv'
- name: existingWorkspaceLocation
  type: string
  required: false
  description: 'Region of the existing workspace, when it differs from location. The Data Collection Endpoint and
    Rule must be in the workspace''s region; a mismatch fails the deployment. Leave empty for a new workspace, or when
    the workspace is in location. Find it: Azure portal > Log Analytics workspaces > the workspace > Overview > Location.
    Default: empty. Example: eastus2.'
  default: ''
  example: eastus2
  find_it: az monitor log-analytics workspace show -g <resource-group> -n <workspace> --query location -o tsv
- name: tags
  type: object
  required: false
  description: 'Tags on every resource the template creates that supports tags. Set them when your policy requires
    tags such as owner or cost centre; Azure Policy can deny an untagged deployment. Find what is required: Azure portal
    > Policy > Assignments on this subscription. Default: none. Example: {"owner": "secops"}.'
  default: {}
  example:
    owner: secops
  find_it: 'Azure portal > Policy > Assignments, for any tag your subscription requires'
- name: principalId
  type: string
  required: false
  description: 'Object ID of the service principal Abstract signs in as. It gets Monitoring Metrics Publisher on the
    Data Collection Rule only, which is all the Logs Ingestion API needs. Find it: Microsoft Entra ID > Enterprise
    applications > the Abstract app > Overview > Object ID. Not the Application (client) ID, which fails with PrincipalNotFound
    or grants nothing. Default: empty, which skips the grant: Abstract then gets HTTP 403 until you grant the role
    yourself. Example: the object ID GUID shown on that page.'
  default: ''
  example: <service-principal-object-id>
  find_it: az ad sp show --id <application-client-id> --query id -o tsv
- name: dataCollectionEndpointName
  type: string
  required: false
  description: 'Name of the Data Collection Endpoint Abstract sends to. Change it when a resource of that name already
    exists in the resource group for something else: a same-named endpoint is updated in place. Find existing ones:
    Azure portal > Monitor > Data Collection Endpoints. Default: abstract-dce. Example: abstract-dce-prod. Its URL
    is the output dataCollectionEndpointUrl.'
  default: abstract-dce
  example: abstract-dce-prod
  find_it: az monitor data-collection endpoint list -g <resource-group> --query [].name -o tsv
- name: dataCollectionRuleName
  type: string
  required: false
  description: 'Name of the Data Collection Rule. Keep the name across redeploys: the rule then keeps its immutable
    ID and Abstract keeps sending. A new name creates a second rule with a new ID, which the Abstract destination must
    then be changed to, and a same-named rule made for something else is replaced. Find existing ones: Azure portal
    > Monitor > Data Collection Rules. Default: abstract-dcr. Example: abstract-dcr-prod.'
  default: abstract-dcr
  example: abstract-dcr-prod
  find_it: az monitor data-collection rule list -g <resource-group> --query [].name -o tsv
- name: customTablePlan
  type: string
  required: false
  description: 'Table plan of AbstractEventLogs_CL. Keep leaves an existing table''s plan alone and creates a new table
    as Analytics, so a redeploy never changes cost by accident. Analytics runs analytics rules and this content; Basic
    is cheaper with limited queries; Auxiliary is the data lake tier, cheapest, with no analytics rules or alerts on
    it. A plan set here applies to the whole table. Find the current plan: Log Analytics workspaces > the workspace
    > Tables > AbstractEventLogs_CL > Plan. Default: Keep. Example: Analytics.'
  default: Keep
  example: Analytics
  find_it: 'az monitor log-analytics workspace table show -g <resource-group> --workspace-name <workspace> -n AbstractEventLogs_CL --query plan -o tsv'
  allowed:
  - Keep
  - Analytics
  - Basic
  - Auxiliary
- name: customTableRetentionDays
  type: int
  required: false
  description: 'Total retention of AbstractEventLogs_CL in days, 0 to 4383. 0 sends no retention: an existing table
    keeps its own, a new one takes the workspace''s. Shortening it deletes data older than the new value; lengthening
    it bills each extra GB-day. Find the current value: Log Analytics workspaces > the workspace > Tables > AbstractEventLogs_CL
    > Total retention. Default: 0. Example: 365.'
  default: 0
  example: 365
  find_it: 'az monitor log-analytics workspace table show -g <resource-group> --workspace-name <workspace> -n AbstractEventLogs_CL --query totalRetentionInDays -o tsv'
- name: enableDcrErrorLogs
  type: bool
  required: false
  description: 'Send the Data Collection Rule''s ingestion errors (rejected requests, malformed rows, transformation
    and limit errors) to the DCRLogErrors table. Leave it on: the ingestion API answers 204 before it validates, so
    without it data Azure drops is invisible to you and to Abstract. Turn it off only if another diagnostic setting
    already collects these errors. Where it lands: Logs > DCRLogErrors. Default: true. Example: true. Cost: only the
    error rows.'
  default: true
  example: true
  find_it: 'Your choice. Azure portal > Monitor > Data Collection Rules > the rule > Diagnostic settings shows the current state'
- name: enableAsim
  type: bool
  required: false
  description: 'Also write each event into the Microsoft ASim table for its schema (ASimAuthenticationEventLogs, ASimNetworkSessionLogs
    and the others in asimSchemas), mapped from the Abstract Common Schema. Turn it on so Microsoft''s ASIM analytics
    rules, hunting queries and workbooks see Abstract data. Expect new alerts, and duplicates where a Microsoft connector
    already collects the same vendor. Without excludeAsimFromAbstractTable each mapped event is stored and billed twice.
    Needs Microsoft Sentinel on the workspace. Find the tables: Logs > Tables > ASim*. Default: false. Example: true.'
  default: false
  example: true
  find_it: 'Your choice. Azure portal > Microsoft Sentinel > Content hub lists the ASIM content you already run'
- name: asimSchemas
  type: array
  required: false
  description: 'ASIM schemas to write when enableAsim is on: [''*''] for all eight (AuditEvent, Authentication, Dns,
    FileEvent, NetworkSession, ProcessEvent, RegistryEvent, WebSession), or a list of names. Narrow it to bring ASIM
    in one schema at a time. Each schema is one dataflow of the 20 a rule allows. Default: [''*'']. Example: [''Authentication'',
    ''NetworkSession''].'
  default:
  - '*'
  example:
  - Authentication
  - NetworkSession
  find_it: 'Your choice. Names: AuditEvent, Authentication, Dns, FileEvent, NetworkSession, ProcessEvent, RegistryEvent, WebSession'
- name: excludeAsimFromAbstractTable
  type: bool
  required: false
  description: 'Store once. With enableAsim on, an event an ASIM dataflow takes is not also written to AbstractEventLogs_CL,
    so it is stored and billed once, in its ASim table. Turn it on once your content reads the ASim tables; this solution''s
    rules and parser already do. Content of your own that reads only AbstractEventLogs_CL stops seeing those events.
    Default: false. Example: true.'
  default: false
  example: true
  find_it: 'Your choice. Azure portal > Microsoft Sentinel > Analytics: check that no rule of yours reads only AbstractEventLogs_CL'
- name: lakeTableName
  type: string
  required: false
  description: 'Name of a second custom table on the Auxiliary (data lake) plan, for events nothing in Sentinel needs
    to alert on. Set it with lakeCategories to cut cost: lake rows cost about 0.15 USD per GB at eastus list price
    against about 4.30 in the Analytics tier, but analytics rules, ASIM parsers and this content do not run on them,
    and the /query API returns no rows for them (use the /search API or a KQL job). Must end in _CL. Default: empty,
    lake route off. Example: AbstractLake_CL.'
  default: ''
  example: AbstractLake_CL
  find_it: 'Your choice: a new name ending in _CL'
- name: lakeCategories
  type: array
  required: false
  description: 'Abstract Common Schema event categories sent to the lake table instead of AbstractEventLogs_CL. An
    event matches when its event.category contains one of them. Events an ASIM dataflow takes never go to the lake.
    Find the categories in your data: in Abstract, the event.category field of the events you route. Default: empty,
    lake route off. Example: [''network'', ''dns''].'
  default: []
  example:
  - network
  find_it: 'In Abstract: the event.category field of the events you route'
- name: lakeRetentionDays
  type: int
  required: false
  description: 'Total retention of the lake table in days, 30 to 4383. Used only when the lake route is on. Lake retention
    is billed per GB-month at the data lake rate. Default: 365. Example: 730.'
  default: 365
  example: 730
  find_it: 'Your choice: your retention policy'
- name: nativeVendors
  type: array
  required: false
  description: 'Vendors and Microsoft tables the rule also writes to, one dataflow each of the 20 a rule allows, so
      Microsoft''s own Content hub content works unchanged on Abstract-delivered data. Supported: okta (OktaV2_CL,
      created if missing), crowdstrike-hosts (CrowdStrikeHostsV2_CL, created if missing), csl-cef (CEF lines into
      CommonSecurityLog), csl-acs (Cisco ASA, Fortinet FortiGate and F5 ASM into CommonSecurityLog), syslog (Linux,
      Nutanix and Infoblox lines into Syslog), aws-cloudtrail (AWSCloudTrail), and the ASIM schemas asim-alert (Abstract
      findings into ASimAlertEventLogs), asim-dhcp (ASimDhcpEventLogs) and asim-user-management
      (ASimUserManagementActivityLogs). Use a vendor entry instead of, not as well as, Microsoft''s own connector for
      that vendor, or every event arrives twice. When two entries select the same event it goes to one table only, the
      first in this order: asim-alert, okta, crowdstrike-hosts, aws-cloudtrail, csl-cef, csl-acs, syslog, asim-dhcp,
      asim-user-management. So Infoblox DHCP lines stay in Syslog, and CloudTrail and Okta user changes stay in
      AWSCloudTrail and OktaV2_CL. An unsupported name stops the deployment before any change. Default: none. Example:
      [''okta'', ''csl-cef''].'
  default: []
  example:
  - okta
  find_it: 'Azure portal > Microsoft Sentinel > Content hub, the vendor solutions you run. Supported: okta, csl-cef,
    csl-acs, syslog, aws-cloudtrail, crowdstrike-hosts, asim-alert, asim-dhcp and asim-user-management'
- name: oktaDomain
  type: string
  required: false
  description: 'Your Okta org domain, written to the DomainName column of OktaV2_CL as Microsoft''s own Okta connector
    does. Used only with okta in nativeVendors. Microsoft''s Okta content does not filter on it, so empty works, but
    the column is then empty. Quotes, spaces, backslashes, | and ; stop the deployment. Find it: the address you sign
    in to Okta with, without https://. Default: empty. Example: example.okta.com.'
  default: ''
  example: example.okta.com
- name: excludeNativeVendorsFromAsim
  type: bool
  required: false
  description: 'Stores each vendor event in one place. With a vendor in nativeVendors, an event that vendor''s table
    takes is not also written to the ASim tables or the lake, and, with excludeAsimFromAbstractTable on, not to AbstractEventLogs_CL
    either. Without it the same Okta event lands in both ASimAuditEventLogs and OktaV2_CL and is billed twice. Turn it
    off only if you need that vendor in Microsoft''s ASIM content as well as in the vendor''s own solution. With it
    on, this solution''s two analytics rules, the connector tile and ASim_AbstractEvent read that vendor''s table, so they still
    see its events, but Microsoft''s own ASIM rules and parsers do not. Find what a vendor lane takes: Logs, then query the vendor table, for example OktaV2_CL. Default:
    true. Example: true.'
  default: true
  example: true
  find_it: 'Azure portal > Microsoft Sentinel > Content hub: confirm the vendor solution is installed'
- name: deployDataConnectors
  type: bool
  required: false
  description: 'Install the data connector tile Abstract Security (Security Data Pipeline). Its status counts Abstract
    rows in AbstractEventLogs_CL and the ASim tables. Turn it off only if you do not want the tile. Find it after deployment:
    Microsoft Sentinel > Data connectors. Default: true. Example: true. No ingestion cost.'
  default: true
  example: true
  find_it: 'Your choice. After deployment: Microsoft Sentinel > Data connectors'
- name: deployParsers
  type: bool
  required: false
  description: 'Install the workspace function ASim_AbstractEvent, which reads every Abstract event wherever the routes
    stored it and gives it ASIM column names. The hunting queries and the Pipeline Overview and Value & ROI workbooks read it,
    so turning it off breaks them. Find it after deployment: Logs > Functions > ASim_AbstractEvent. Default: true. Example: true.'
  default: true
  example: true
  find_it: 'Your choice. After deployment: Logs > Functions > ASim_AbstractEvent'
- name: deployAnalyticsRules
  type: bool
  required: false
  description: 'Install the analytics rules Abstract Security - Finding, Abstract Security - High or Critical event and Abstract -
    Repeated auth failures followed by success. Each is on or off as enabledAnalyticsRules says. They read the tables
    directly and call no workspace function. Find them: Microsoft Sentinel > Analytics. Default: true. Example: true.'
  default: true
  example: true
  find_it: 'Your choice. After deployment: Microsoft Sentinel > Analytics'
- name: enabledAnalyticsRules
  type: array
  required: false
  description: 'The analytics rules to turn on: finding (one incident per Abstract finding), high-or-critical (high or critical
    Abstract events) and repeated-auth-failures (failed sign-ins followed by a success). Every deployment sets each rule
    on or off from this list, so choose the rules here rather than in Microsoft Sentinel > Analytics, or the next
    deployment turns them off. An enabled rule runs every hour and can create incidents. Default: none. Example:
    [''finding''].'
  default: []
  example:
  - finding
  find_it: 'Microsoft Sentinel > Analytics, the Abstract rules and their Status. Supported: finding, high-or-critical, repeated-auth-failures'
- name: deployHuntingQueries
  type: bool
  required: false
  description: 'Install the hunting queries Rare or newly-seen product activity, High cumulative-risk identities and
    Daily value & reduction summary. Find them: Microsoft Sentinel > Hunting > Queries. Default: true. Example: true.
    They run only when someone runs them.'
  default: true
  example: true
  find_it: 'Your choice. After deployment: Microsoft Sentinel > Hunting > Queries'
- name: deployWorkbooks
  type: bool
  required: false
  description: 'Install the workbooks Pipeline Overview, Value & ROI, Data Health and Cost by Table (the Sentinel Discovery workbook has its own switch). Find them: Microsoft Sentinel > Workbooks
    > My workbooks. Default: true. Example: true. They query only when opened.'
  default: true
  example: true
  find_it: 'Your choice. After deployment: Microsoft Sentinel > Workbooks > My workbooks'
- name: deployDiscovery
  type: bool
  required: false
  description: 'Also run the Sentinel discovery inventory against this workspace (template azure-destination-sentinel-discovery
    as a module): a managed identity with read-only roles, a storage account for the report, and two short deployment
    scripts. Off by default because it adds roles and runs for 5 to 15 minutes. Find the output: the storage account in
    this resource group, container sentinel-discovery. Default: false. Example: false.'
  default: false
  example: false
- name: deployDiscoveryWorkbook
  type: bool
  required: false
  description: 'Install the Sentinel Discovery workbook, which inventories the workspace (tables, connectors, rules,
    cost). Find it: Microsoft Sentinel > Workbooks > My workbooks. Default: true. Example: true.'
  default: true
  example: true
  find_it: 'Your choice. After deployment: Microsoft Sentinel > Workbooks > My workbooks'
- name: deployAutomationRules
  type: bool
  required: false
  description: 'Install the automation rule Tag & prioritize Abstract-originated incidents, which labels incidents from this
    solution''s rules. It is on or off as enableAutomationRules says. Find it: Microsoft Sentinel > Automation. Default:
    true. Example: true.'
  default: true
  example: true
  find_it: 'Your choice. After deployment: Microsoft Sentinel > Automation'
- name: enableAutomationRules
  type: bool
  required: false
  description: 'Turn on the automation rules this deployment installs: Tag & prioritize Abstract-originated incidents and, with
    deployPlaybookAutomationRules, Run ASTRO Verdict and Tune at source. Every deployment sets them on or off from this
    value, so set it here rather than in Microsoft Sentinel > Automation, or the next deployment turns them off.
    Default: false. Example: true.'
  default: false
  example: true
  find_it: 'Microsoft Sentinel > Automation, the Abstract rules and their Status'
- name: deployPlaybooks
  type: bool
  required: false
  description: 'Install the playbooks Abstract-Enrich-Incident, Abstract-Verdict and Abstract-Tune-At-Source (Logic Apps with a
    Sentinel API connection). They call the Abstract API with the key in the secret keyVaultMode stores, or in
    keyVaultSecretUri. Each playbook''s managed identity needs Key Vault Secrets User on that secret and
    Microsoft Sentinel Responder on the workspace, or runs fail: the deployment grants both when it stores the
    key (keyVaultMode Create or Existing, grantPlaybookRoles); otherwise grant them after deployment. Find them:
    Microsoft Sentinel > Automation > Active playbooks. Default: true. Example: true. Logic App runs are billed
    per action.'
  default: true
  example: true
  find_it: 'Your choice. After deployment: Microsoft Sentinel > Automation > Active playbooks'
- name: deployPlaybookAutomationRules
  type: bool
  required: false
  description: 'Install the automation rules Run ASTRO Verdict and Tune at source, which run two of the playbooks
    (on or off as enableAutomationRules says). Needs deployPlaybooks, and Microsoft Sentinel Automation Contributor on this resource group
    granted to Azure Security Insights (app id 98785600-1bb7-4fb9-b9fa-19afe2c8a360) about 10 minutes before the deployment;
    without it the deployment fails with "Missing required permissions for Microsoft Sentinel on the playbook resource".
    Find the grant: Resource groups > this group > Access control (IAM) > Role assignments. Default: false. Example:
    true.'
  default: false
  example: true
  find_it: 'az role assignment list -g <resource-group> --role "Microsoft Sentinel Automation Contributor" -o table'
- name: abstractBaseUrl
  type: string
  required: false
  description: 'Abstract API base URL the playbooks call. Change it only for a non-production Abstract environment.
    Find it: the address of your Abstract API, as given by Abstract. Default: https://api.abstractsecurity.app. Example:
    https://api.abstractsecurity.app.'
  default: https://api.abstractsecurity.app
  example: https://api.abstractsecurity.app
  find_it: 'The address of your Abstract API, as given by Abstract'
- name: abstractVendorAccountId
  type: string
  required: false
  description: 'Abstract vendor account ID the playbooks send as x-as-vendor-account-id, which selects your tenant
    in Abstract. Find it: in Abstract, your account settings, or ask Abstract. Default: empty, to set later in each
    playbook''s parameters; until then the playbooks'' Abstract calls fail. Example: AbCdEf1234.'
  default: ''
  example: <abstract-vendor-account-id>
  find_it: 'In Abstract: your account settings, or ask Abstract'
- name: keyVaultSecretUri
  type: string
  required: false
  description: 'URI of the Key Vault secret holding the Abstract API key, with ?api-version, as the playbooks GET it at run
    time. Used only when keyVaultMode is None, the default; with Create or Existing the deployment points the
    playbooks at the secret it stored. Find it: Key vaults > the vault > Secrets > the secret > Secret
    Identifier, then add ?api-version=7.4. Default: empty, to set later; until then the playbooks'' Abstract
    calls fail. Example: https://myvault.vault.azure.net/secrets/abstract-api-key?api-version=7.4.'
  default: ''
  example: https://<vault-name>.vault.azure.net/secrets/<secret-name>?api-version=7.4
  find_it: 'az keyvault secret show --vault-name <vault> -n <secret> --query id -o tsv'
- name: lookbackHours
  type: int
  required: false
  description: 'How many hours of Abstract data the Abstract-Enrich-Incident playbook reads around an incident. Raise
    it for slow-moving investigations; a longer window makes each run slower. Default: 24. Example: 72.'
  default: 24
  example: 72
  find_it: 'Your choice: how far back an investigation should read'
- name: keyVaultMode
  type: string
  required: false
  description: 'Where this deployment stores the Abstract API key the playbooks call Abstract with. None, the default, stores
    nothing: the playbooks read the secret keyVaultSecretUri names, and you grant their roles yourself. Create makes a Key
    Vault in this resource group (RBAC authorization, soft delete with 7-day retention, purge protection on, public network
    access enabled, no network rules) and writes abstractApiKey into it. A rerun with Create applies those settings to the
    vault again, so a vault you locked down afterwards (firewall, private endpoint) is opened again: once the vault exists,
    rerun with Existing. Existing writes abstractApiKey into the vault keyVaultName names, which must be in this resource
    group and use RBAC authorization for the role grants to apply. With Create or Existing, keyVaultSecretUri is ignored.
    Find existing vaults: Azure portal > Key vaults, filtered to this resource group. Default: None. Example: Create.'
  default: None
  allowed:
  - None
  - Create
  - Existing
  find_it: az keyvault list -g <resource-group> --query [].name -o tsv
- name: abstractApiKey
  type: securestring
  required: false
  description: 'The Abstract API key, written as a Key Vault secret when keyVaultMode is Create or Existing, and required
    then. A secure parameter: it never appears in the deployment''s inputs, outputs or history. A rerun with Create or Existing
    needs the key again and writes it as a new version of the secret. Find it: the API key Abstract issued for your tenant,
    or ask Abstract. Default: empty. With Terraform, the key is written in plain text to the Terraform state (the deployment''s
    parameters_content), even though the variable is marked sensitive: from Terraform, keep the key out of it with keyVaultMode
    None and keyVaultSecretUri pointing at a secret you created in Key Vault yourself.'
  secret: true
- name: keyVaultName
  type: string
  required: false
  description: 'Name of the Key Vault. Create: 3 to 24 letters, digits and hyphens, unique in Azure; empty generates abskvs-<hash>
    from this resource group and keyVaultNameSuffix. Existing: the exact name of a vault in this resource group. Used only
    when keyVaultMode is Create or Existing. Purge protection keeps a deleted vault''s name reserved for its 7-day retention.
    Find it: Azure portal > Key vaults > Name. Default: empty. Example: abstract-sentinel-kv.'
  default: ''
  find_it: az keyvault list -g <resource-group> --query [].name -o tsv
- name: keyVaultNameSuffix
  type: string
  required: false
  description: 'Text mixed into the generated Key Vault name (keyVaultMode Create with keyVaultName empty), so a redeploy
    gets a new name. Set it after you deleted the resource group or the vault: purge protection keeps the deleted vault,
    and its name, for 7 days, and the same generated name then fails with VaultAlreadyExists. Empty, the default, keeps
    the name earlier runs generated. Find deleted vaults: Azure portal > Key vaults > Manage deleted vaults. Default: empty.
    Example: 2.'
  default: ''
  example: '2'
  find_it: az keyvault list-deleted --query [].name -o tsv
- name: keyVaultSecretName
  type: string
  required: false
  description: 'Name of the secret that holds the Abstract API key, 1 to 127 letters, digits and hyphens. Used only when
    keyVaultMode is Create or Existing; a secret of that name already in the vault gets a new version. Find it:
    Key vaults > the vault > Objects > Secrets. Default: abstract-api-key. Example: abstract-api-key.'
  default: abstract-api-key
  example: abstract-api-key
  find_it: 'az keyvault secret list --vault-name <vault> --query [].name -o tsv'
- name: grantPlaybookRoles
  type: bool
  required: false
  description: 'Grant each playbook''s managed identity Key Vault Secrets User on the stored secret (the secret only, not
    the vault) and Microsoft Sentinel Responder on the workspace, the two roles the playbooks need to run. Applies only
    when this deployment stores the key (keyVaultMode Create or Existing) and installs the playbooks; with keyVaultMode
    None nothing is granted. Needs Owner, or User Access Administrator, on this resource group. Find the grants: Key vaults
    > the vault > Objects > Secrets > the secret > Access control (IAM), and the workspace > Access control (IAM). It is
    the master switch: grantPlaybookResponder and grantPlaybookSecretsUser leave out one role each, for playbooks that already
    hold it. Default: true. Example: true.'
  default: true
  example: true
  find_it: az role assignment list --scope <secret-or-workspace-resource-id> -o table
- name: grantPlaybookResponder
  type: bool
  required: false
  description: 'With grantPlaybookRoles, grant Microsoft Sentinel Responder on the workspace to each playbook. Turn it off
    when the playbooks already hold that role from an assignment made outside this deployment: Azure refuses a second assignment
    of the same role to the same identity on the same scope (RoleAssignmentExists), which fails the deployment. It applies
    to all three playbooks, so if only some hold the role, grant it to the others yourself and turn this off. Find the grants:
    the workspace > Access control (IAM) > Role assignments. Default: true. Example: false.'
  default: true
  example: false
  find_it: az role assignment list --scope <workspace-resource-id> --role "Microsoft Sentinel Responder" -o table
- name: grantPlaybookSecretsUser
  type: bool
  required: false
  description: 'With grantPlaybookRoles, grant Key Vault Secrets User on the stored secret to each playbook. Turn it off
    when the playbooks already hold that role on the secret from an assignment made outside this deployment, which would
    otherwise fail with RoleAssignmentExists. It applies to all three playbooks, so if only some hold the role, grant it
    to the others yourself and turn this off. Find the grants: Key vaults > the vault > Objects > Secrets > the secret >
    Access control (IAM). Default: true. Example: false.'
  default: true
  example: false
  find_it: az role assignment list --scope <secret-resource-id> --role "Key Vault Secrets User" -o table
- name: deployDataPlane
  type: bool
  required: false
  description: 'Deploy the data plane: the workspace (new or existing), Microsoft Sentinel on a new workspace, the Data
    Collection Endpoint, the AbstractEventLogs_CL table, the Data Collection Rule and its role for the Abstract app. Turn
    it off only to install content or run discovery against a workspace that already has it, for example a second run after
    the data plane was deployed once. Off needs createWorkspace false and workspaceName set to that workspace in this resource
    group, or the deployment fails. Find what exists: Azure portal > Monitor > Data Collection Rules. Default: true. Example:
    false.'
  default: true
  example: false
- name: deployContent
  type: bool
  required: false
  description: 'Install the Microsoft Sentinel content: the data connector page, the ASim_AbstractEvent parser, analytics
    rules, hunting queries, workbooks, automation rules and playbooks, each behind its own switch. Turn it off for a data-plane-only
    or discovery-only deployment. The analytics rules query AbstractEventLogs_CL, so content needs the data plane in the
    same workspace, from this deployment or an earlier one. Find it after deployment: Microsoft Sentinel > Content hub >
    Installed. Default: true. Example: false.'
  default: true
  example: false
- name: discoveryDays
  type: int
  required: false
  description: 'Discovery: look-back window in days for table volume, ingestion health, agents and rule activity, 1 to 90.
    A longer window evens out weekly patterns and makes the run slower. Used only when deployDiscovery is true. Default:
    30. Example: 14.'
  default: 30
  example: 14
- name: discoveryDeviceDays
  type: int
  required: false
  description: 'Discovery: window in days for the CEF and Syslog sender breakdowns, 1 to 7. These scan the raw tables, so
    each extra day adds query time and cost on a busy workspace; leave it at 1 unless the senders vary by day. Used only
    when deployDiscovery is true. Default: 1. Example: 1.'
  default: 1
  example: 1
- name: discoveryProfileTopTables
  type: int
  required: false
  description: 'Discovery: how many of the largest Analytics-plan tables to break down by two columns, 0 to 50. 0 turns
    the breakdown off. Used only when deployDiscovery is true. Default: 15. Example: 25.'
  default: 15
  example: 25
- name: discoverySkipRuleQueryText
  type: bool
  required: false
  description: 'Discovery: leave the KQL text of analytics rules out of the output; the rule-to-table mapping is still produced.
    Turn it on when rule logic must not leave the workspace, even into your own storage account. Used only when deployDiscovery
    is true. Default: false. Example: true.'
  default: false
  example: true
- name: discoverySkipContentQueryText
  type: bool
  required: false
  description: 'Discovery: leave the KQL text of functions, hunting queries and saved searches out of the output; the content-to-table
    mapping is still produced. Used only when deployDiscovery is true. Default: false. Example: true.'
  default: false
  example: true
- name: discoveryDeployWorkbook
  type: bool
  required: false
  description: 'Discovery: also install the discovery template''s own inventory workbook, Sentinel inventory (<workspace>). On
    by default, so this deployment and the standalone discovery template install the same resources. The content
    installs its own Sentinel Discovery workbook (deployDiscoveryWorkbook) as well, so both are installed by
    default; turn this off to keep only the content''s workbook. Used only when deployDiscovery is true. Find
    it: Microsoft Sentinel > Workbooks > My workbooks. Default: true. Example: false.'
  default: true
  example: false
- name: discoverySendToAbstract
  type: bool
  required: false
  description: 'Discovery: send a copy of the output to Abstract. When on, exactly two files leave your tenant over HTTPS
    to discoveryAbstractSasUrl: inventory.zip and report.html. Off keeps everything in your storage account. Used only when
    deployDiscovery is true. Default: false. Example: false.'
  default: false
  example: false
- name: discoveryAbstractSasUrl
  type: securestring
  required: false
  description: 'Discovery: the HTTPS SAS URL of the container Abstract gave you, with write permission on that container
    only. Used only when deployDiscovery and discoverySendToAbstract are true. Find it: from Abstract, with the request
    to send a copy. Default: empty.'
  secret: true
- name: discoveryStorageAccountName
  type: string
  required: false
  description: 'Discovery: name of the storage account the report is written to, 3 to 24 lowercase letters and digits, unique
    in Azure. Empty generates one. Created with public blob access and shared-key access off. Used only when deployDiscovery
    is true. Find it after the run: Storage accounts > the account > Containers > sentinel-discovery. Default: empty. Example:
    abstractdiscovery01.'
  default: ''
  example: abstractdiscovery01
- name: discoveryAssignSubscriptionReader
  type: bool
  required: false
  description: 'Discovery: grant the discovery identity Reader on the workspace subscription, so it can list data collection
    rules, endpoints, Sentinel workbooks and playbooks. Off: those areas are recorded as not read. Used only when deployDiscovery
    is true. Default: true. Example: true.'
  default: true
  example: true
- name: discoveryGrantDeployerBlobRead
  type: bool
  required: false
  description: 'Discovery: give the person deploying Storage Blob Data Reader on the report container. Shared keys are off,
    so without it even an Owner cannot open the report. Used only when deployDiscovery is true. Default: true. Example:
    true.'
  default: true
  example: true
- name: discoveryRbacWaitMinutes
  type: int
  required: false
  description: 'Discovery: minutes to wait for the new role assignments to take effect before failing, 1 to 45. Raise it
    when a run fails with an authorization error right after the roles were granted. Used only when deployDiscovery is true.
    Default: 20. Example: 30.'
  default: 20
  example: 30

outputs:
- workspaceName
- workspaceResourceId
- dataCollectionRuleImmutableId
- dataCollectionEndpointUrl
- logStreamName
- rbacAssigned
- dataFlowCount
- nativeVendorTables
- discoveryReportBlobUrl
- contentTemplateCount
- abstractDestination
- abstractApiKeySecretUri
verify:
- check: The outputs carry the values the Abstract destination needs (after a portal deploy, use the name shown
    under the resource group's Deployments)
  command: az deployment group show -g <resource-group> -n azure-destination-sentinel-solution --query properties.outputs
  healthy: abstractDestination holds four of them, tenant_id, data_collection_endpoint, data_collection_rule_id and
    log_stream_name (Custom-AbstractEventLogs_CL), also present as dataCollectionEndpointUrl, dataCollectionRuleImmutableId
    and logStreamName; enter them in the Abstract Azure Sentinel Destination with the app's client ID and secret.
- check: Abstract events are arriving, wherever the routes stored them
  command: ASim_AbstractEvent | where TimeGenerated > ago(1h) | summarize count() by EventVendor, EventProduct
  healthy: A count that matches the event count Abstract reports for the route, less any events sent to the lake table.
- check: Azure is not rejecting rows
  command: DCRLogErrors | where TimeGenerated > ago(1h) | summarize count() by OperationName, Message
  healthy: No rows. The ingestion API answers 204 before it validates, so a rejected request shows up only here,
    a few minutes later.
- check: The lake table holds its events (Auxiliary tables answer only through the search API)
  command: az rest --method post --resource https://api.loganalytics.io --url https://api.loganalytics.io/v1/workspaces/<workspace-id>/search?timespan=P1D
    --body '{"query":"AbstractLake_CL | count"}'
  healthy: A count above zero once events in lakeCategories are routed. The /query API and the portal's Logs page
    show 0 for this table even when it holds data.
cost: 'Ingestion into AbstractEventLogs_CL is charged at its plan (Analytics by default). With enableAsim, each mapped
  event is a further copy in its ASim table unless excludeAsimFromAbstractTable is on; each vendor in nativeVendors
  adds a copy in that vendor''s table. Lake rows are charged at the data lake rate. Retention beyond the free period,
  and Logic App runs of the playbooks, are charged. Data Collection Endpoint and Rule billing is not verified.'
when_to_use: 'A customer receiving Abstract data in Microsoft Sentinel who wants the Azure side and the Abstract content
  in one deployment.'
when_not_to_use: 'When you only need the ingestion stack; use azure-destination-sentinel. When the Content hub package
  must come from the Marketplace instead; use azure-destination-sentinel-content-pack.'
live_test: static
lint_skip:
- check: 'arm-ttk:DeploymentTemplate Must Not Contain Hardcoded Uri'
  reason: The remaining hits are https://api.loganalytics.io in the nested Sentinel discovery module's bootstrap script, the
    Log Analytics query endpoint and token audience. ARM's environment() has no Log Analytics endpoint; Resource Manager,
    storage and the playbooks' Key Vault audience come from environment().
- check: 'arm-ttk:Template Should Not Contain Blanks'
  reason: The blanks are empty values inside the deployed Sentinel content, Logic App runAfter, actions and
    customParameterValues, analytics rule groupByAlertDetails, groupByCustomDetails, tactics and entities, and workbook
    serializedData, so removing them would change the deployed content.
site_guide: sentinel-guide
