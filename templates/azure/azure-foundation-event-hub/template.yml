id: azure-foundation-event-hub
title: Event Hub source
cloud: azure
role: foundation
scope: resource-group
summary: 'Azure Monitor cannot send diagnostic data directly to a third party, so every Azure onboarding
  starts here: an Event Hubs namespace with one hub per log source, a consumer group Abstract reads from,
  and a checkpoint storage account. Deploy it first; the Activity Log, Entra ID and policy templates consume
  its outputs.'
formats:
- bicep
- arm
- portal-ui
- script
depends_on: []
permissions:
- role: Contributor
  where: The target resource group
  why: 'Deployer: Create the namespace, hubs, consumer groups and checkpoint storage account.'
- role: User Access Administrator or Owner
  where: The target resource group
  why: 'Deployer: Only when enableRbac=true: creating role assignments is a separate right that Contributor
    lacks.'
- role: Azure Event Hubs Data Receiver
  where: The namespace, or a single hub
  why: 'Abstract: Abstract reads events; Receiver is sufficient.'
- role: Storage Blob Data Contributor
  where: The checkpoint storage account
  why: 'Abstract: AMQP ingestion mode only: the consumer writes lease and checkpoint blobs.'
creates:
- An Event Hubs namespace (Standard by default, TLS 1.2, Auto-Inflate on)
- One hub per log source, auto-named <hubPrefix>-<environment>-<source> (defaults activity, entra, defender)
- A consumer group named abstract on every hub
- A checkpoint storage account and private blob container for the Abstract consumer
- A Listen SAS rule abstract-access at namespace level, and optional per-hub rules
- A separate diagnostics Send rule abstract-diagnostics-send, emitted as abstractDiagnosticsAuthRuleId
- 'Optional role assignments when enableRbac=true: Azure Event Hubs Data Receiver on the namespace and
  Storage Blob Data Contributor on the checkpoint storage'
- 'Networking guardrails: public, IP allowlist or private endpoints, with Safe Mode'
- Optional namespace diagnostic settings to Log Analytics or archive storage
never_touches:
- Existing Event Hubs namespaces, hubs and consumer groups in the subscription
- Existing diagnostic settings on the subscription, the tenant or any resource
- Workload resources in the target resource group
- Existing storage accounts, unless you point storageAccountId at one for diagnostics archive only
prerequisites:
- Register the Microsoft.EventHub resource provider on the subscription if it has never been used there
- A globally unique namespace name, 6 to 50 characters, starting with a letter
- Decide the ingestion mode first; it determines whether createStorageAccount should be true
- If the namespace firewall will deny by default, keep allowAzureServices true or Azure Monitor cannot
  deliver
- Choose at least 4 partitions; partition count cannot be reduced later
parameters:
- name: location
  type: string
  required: false
  description: Azure region for all resources. Event Hubs must be in the same region as the resources
    being monitored when those resources are regional.
  default: '[resourceGroup().location]'
- name: namespaceName
  type: string
  required: true
  description: 'Event Hubs namespace name - globally unique, 6-50 chars, letters/numbers/hyphens, must
    start with a letter. You are CREATING this, so it is a name you choose - globally unique across Azure.
    Check yours are not taken with: az eventhubs namespace list --query [].name -o tsv'
  find_it: az eventhubs namespace check-name-availability --name <candidate-name> --query nameAvailable
- name: sku
  type: string
  required: false
  description: Namespace pricing tier. Abstract requires STANDARD as the minimum tier (Basic lacks custom
    consumer groups, IP firewall and >1 day retention; it is allowed here only for lab scenarios).
  default: Standard
  allowed:
  - Basic
  - Standard
  - Premium
- name: capacity
  type: int
  required: false
  description: 'Throughput Units (Basic/Standard, 1-40) or Processing Units (Premium: 1/2/4/6/8/10/12/16,
    max 16). NOTE the @maxValue(40) below is the STANDARD ceiling - Bicep cannot express a per-SKU range,
    so a Premium value above 16 passes here and is rejected by ARM. Sizing: ~1 TU per 1 MB/s of expected
    ingress.'
  default: 1
- name: autoInflate
  type: bool
  required: false
  description: Enable Auto-Inflate so the namespace scales Throughput Units automatically with load (Standard
    tier only; ignored on Basic/Premium).
  default: true
- name: maxThroughputUnits
  type: int
  required: false
  description: Auto-Inflate ceiling in Throughput Units (Standard only, max 40).
  default: 20
- name: minimumTlsVersion
  type: string
  required: false
  description: Minimum TLS version the namespace accepts. Leave at 1.2 unless a legacy producer forces
    otherwise.
  default: '1.2'
  allowed:
  - '1.0'
  - '1.1'
  - '1.2'
- name: tags
  type: object
  required: false
  description: Tags applied to every resource created by this template.
  default: {}
- name: autoHubNaming
  type: bool
  required: false
  description: true = generate hub names as <hubPrefix>-<environment>-<source> from hubSources; false
    = use the eventHubs array verbatim.
  default: true
- name: hubPrefix
  type: string
  required: false
  description: Prefix for auto-generated hub names (e.g. "abs" -> abs-prod-entra).
  default: abs
- name: environment
  type: string
  required: false
  description: Environment token used in auto-generated hub names (prod, staging, dev, ...).
  default: prod
- name: hubSources
  type: array
  required: false
  description: 'Log sources - one Event Hub is generated per entry when autoHubNaming = true. Typical
    sources: activity (Azure Activity Log), entra (Entra ID sign-in/audit), defender (Defender XDR streaming),
    m365, resource (Azure Resource Logs).'
  default:
  - activity
  - entra
  - defender
- name: eventHubs
  type: array
  required: false
  description: 'Explicit hub definitions, used only when autoHubNaming = false: [{ name, partitionCount,
    retentionDays }].'
  default:
  - name: default-hub
    partitionCount: 4
    retentionDays: 7
- name: defaultPartitionCount
  type: int
  required: false
  description: Partition count for auto-generated hubs. Abstract docs recommend AT LEAST 4. Partitions
    cannot be reduced after creation; max 32 on Standard.
  default: 4
- name: defaultRetentionDays
  type: int
  required: false
  description: Message retention in days for auto-generated hubs. Size this to ride out ingestion downtime/delay
    (Abstract docs). Standard allows 1-7; Basic is forced to 1.
  default: 7
- name: consumerGroupName
  type: string
  required: false
  description: Consumer group created on every hub for the Abstract platform. Enter this value in the
    "Event Hub Consumer Group" field of the Abstract integration. Ignored on Basic SKU (only $Default
    exists there).
  default: abstract
- name: enableSas
  type: bool
  required: false
  description: Create SAS authorization rules for Connection String authentication in Abstract. When false,
    local (SAS) auth is fully DISABLED on the namespace and only Entra ID / RBAC works.
  default: true
- name: sasRuleName
  type: string
  required: false
  description: Name of the least-privilege SAS rule created at namespace level (and per hub when perHubSasRules
    = true). Prefer this over RootManageSharedAccessKey when pasting a connection string into Abstract.
  default: abstract-access
- name: sasRights
  type: array
  required: false
  description: Rights for the SAS rule. Listen is all Abstract needs to consume; include Send only if
    log producers will share the same rule.
  default:
  - Listen
- name: perHubSasRules
  type: bool
  required: false
  description: Also create a per-hub SAS rule with the same name/rights - a tighter blast radius than
    the namespace-level rule.
  default: false
- name: createDiagnosticsSendRule
  type: bool
  required: false
  description: 'Create a dedicated Send-only SAS rule for LOG PRODUCERS (Azure diagnostic settings: Activity
    Log, Entra ID, Defender, resource logs). This is separate from the Listen-only Abstract consumer rule
    and is what the subscription Activity Log export uses. Requires local auth (enableSas = true).'
  default: true
- name: diagnosticsSendRuleName
  type: string
  required: false
  description: Name of the diagnostics SAS rule used by log producers / diagnostic settings.
  default: abstract-diagnostics-send
- name: diagnosticsRuleRights
  type: string
  required: false
  description: Rights on the diagnostics rule. ManageSendListen is what Microsoft documents as required
    for Event Hubs streaming and is the default; SendOnly is narrower but UNVERIFIED - if it does not
    work, every Azure log path silently collects nothing. See the comment above this parameter.
  default: ManageSendListen
  allowed:
  - ManageSendListen
  - SendOnly
- name: enableRbac
  type: bool
  required: false
  description: 'Assign Azure RBAC roles for Service Principal (role-based) authentication in Abstract:
    Event Hubs role on the namespace + Storage Blob Data role on the checkpoint storage account.'
  default: false
- name: principalId
  type: string
  required: false
  description: Object ID of the service principal (or managed identity) Abstract will authenticate as.
    Find it on the Enterprise Application blade - this is the SP object ID, NOT the app/client ID.
  default: ''
  find_it: az ad sp show --id <abstract-app-client-id> --query id -o tsv
- name: roleDefinitionName
  type: string
  required: false
  description: Built-in Event Hubs data-plane role assigned on the namespace. Abstract docs specify Azure
    Event Hubs Data Receiver.
  default: Azure Event Hubs Data Receiver
  allowed:
  - Azure Event Hubs Data Sender
  - Azure Event Hubs Data Receiver
  - Azure Event Hubs Data Owner
- name: storageRoleDefinitionName
  type: string
  required: false
  description: Built-in Storage data-plane role assigned on the checkpoint storage account. Abstract docs
    specify Storage Blob Data Contributor.
  default: Storage Blob Data Contributor
  allowed:
  - Storage Blob Data Contributor
  - Storage Blob Data Owner
- name: principalType
  type: string
  required: false
  description: Type of the principal being granted RBAC (setting this avoids PrincipalNotFound failures
    from directory replication delay on freshly created SPNs).
  default: ServicePrincipal
  allowed:
  - ServicePrincipal
  - User
  - Group
- name: createStorageAccount
  type: bool
  required: false
  description: Create the checkpoint Storage Account + blob container required by the Abstract integration.
    Set false only if you will point Abstract at an existing storage account you manage yourself.
  default: true
- name: storageAccountName
  type: string
  required: false
  description: Checkpoint storage account name (3-24 lowercase letters/numbers, globally unique). Leave
    EMPTY to auto-generate a unique name (abs<hash>).
  default: ''
- name: storageSkuName
  type: string
  required: false
  description: Replication SKU for the checkpoint storage account. LRS is sufficient - checkpoints are
    rebuildable consumer state, not log data.
  default: Standard_LRS
  allowed:
  - Standard_LRS
  - Standard_ZRS
  - Standard_GRS
  - Standard_RAGRS
- name: blobContainerName
  type: string
  required: false
  description: Private blob container that stores Event Hub processing checkpoints. Enter this value in
    the "Storage Blob Container Name" field of the Abstract integration. Lowercase letters, numbers and
    dashes.
  default: abstract-checkpoints
- name: storageAllowSharedKeyAccess
  type: bool
  required: false
  description: Allow shared-key (connection string) access on the storage account. REQUIRED true for Connection
    String authentication in Abstract. Set false only for pure Service Principal deployments.
  default: true
- name: storageApplyIpRules
  type: bool
  required: false
  description: 'Mirror the Event Hub IP allowlist onto the storage account firewall. NOTE: the storage
    firewall rejects /31 and /32 prefixes - list single addresses as bare IPs.'
  default: true
- name: createStoragePrivateEndpoint
  type: bool
  required: false
  description: Also create a Private Endpoint (blob sub-resource) for the checkpoint storage account when
    private networking is used.
  default: false
- name: storageBlobPrivateDnsZoneId
  type: string
  required: false
  description: Resource ID of the privatelink.blob.core.windows.net Private DNS zone (recommended with
    the storage Private Endpoint).
  default: ''
  find_it: az network private-dns zone show -g <dns-resource-group> -n privatelink.blob.core.windows.net
    --query id -o tsv
- name: enablePrivateEndpoint
  type: bool
  required: false
  description: Create a Private Endpoint for the Event Hubs namespace (Standard/Premium only).
  default: false
- name: subnetId
  type: string
  required: false
  description: Resource ID of the subnet that will host the Private Endpoint NIC(s).
  default: ''
  find_it: az network vnet subnet show -g <vnet-resource-group> --vnet-name <vnet> -n <subnet> --query
    id -o tsv
- name: privateDnsZoneId
  type: string
  required: false
  description: Resource ID of the privatelink.servicebus.windows.net Private DNS zone (recommended with
    the namespace Private Endpoint).
  default: ''
  find_it: az network private-dns zone show -g <dns-resource-group> -n privatelink.servicebus.windows.net
    --query id -o tsv
- name: allowedIpRanges
  type: array
  required: false
  description: Public IP ranges (CIDR) allowed through the namespace firewall - e.g. Abstract egress IPs
    plus your admin ranges. A non-empty list flips the firewall default action to Deny (unless Safe Mode
    is on). Empty entries are filtered out automatically.
  default: []
- name: allowAzureServices
  type: bool
  required: false
  description: Allow trusted Microsoft services (Azure Monitor diagnostic settings, Defender streaming,
    ...) through the firewall. REQUIRED when the firewall is in Deny mode and Azure services stream logs
    into these hubs.
  default: true
- name: disablePublicNetwork
  type: bool
  required: false
  description: Disable ALL public network access on the namespace (Private Endpoint only). Only honored
    when safeMode = false.
  default: false
- name: safeMode
  type: bool
  required: false
  description: "Safe Mode guardrails for external SaaS ingestion (Abstract):\n  true  -> public network\
    \ access stays ON for BOTH the namespace and the\n           checkpoint storage account, the IP allowlist\
    \ is ignored, and the\n           firewall default action stays Allow. Private Endpoints may still\
    \ be\n           created (hybrid connectivity), but they can never lock Abstract out.\n  false ->\
    \ disablePublicNetwork / allowedIpRanges are honored exactly as set.\nShip customers safeMode=true\
    \ for onboarding; flip to false in a hardening phase\nonce Abstract egress IPs are in the allowlist\
    \ or private connectivity is up.\n"
  default: true
- name: enableDiagnostics
  type: bool
  required: false
  description: Enable diagnostic settings on the namespace so you can monitor the health of the log pipeline
    itself.
  default: false
- name: logAnalyticsWorkspaceId
  type: string
  required: false
  description: Resource ID of the Log Analytics workspace for namespace diagnostics.
  default: ''
  find_it: az monitor log-analytics workspace show -g <resource-group> -n <workspace> --query id -o tsv
- name: storageAccountId
  type: string
  required: false
  description: Optional storage account resource ID for diagnostics archive (this is for namespace diagnostics
    - NOT the checkpoint storage account).
  default: ''
  find_it: az storage account show -g <resource-group> -n <storage-account> --query id -o tsv
outputs:
- namespaceName
- namespaceId
- namespaceFqdn
- eventHubNames
- consumerGroup
- sasRuleName
- storageAccountName
- storageAccountUrl
- blobContainerName
- publicAccess
- firewallDefaultAction
- safeModeEnabled
- privateEndpointEnabled
- abstractDiagnosticsAuthRuleId
- abstractOnboarding
abstract:
  integration: azure_eventhub
verify:
- check: The namespace is active and the hubs and consumer group exist
  command: 'az eventhubs namespace show -g <resource-group> -n <namespace> --query "{status:status,sku:sku.name,tls:minimumTlsVersion}"

    az eventhubs eventhub list -g <resource-group> --namespace-name <namespace> --query "[].name"

    az eventhubs eventhub consumer-group list -g <resource-group> --namespace-name <namespace> --eventhub-name
    <hub> --query "[].name"'
  healthy: Status Active, SKU Standard, and a consumer group named abstract alongside $Default.
- check: Messages are arriving in the hub (the producer side works)
  healthy: Namespace metrics show a continuous non-zero Incoming Messages line after a diagnostic setting
    points at the hub.
- check: Abstract is consuming (the consumer side works)
  healthy: Outgoing Messages tracks Incoming Messages with no persistent gap.
- check: Events are landing in Abstract and parsing into ACS
  healthy: A non-zero count for the Azure integration over the last 15 minutes, with cloud.project_id,
    cloud.origin.account_id, related.user and cloud.region populated.
cost: Throughput or processing units are a step charge for provisioned capacity. Auto-Inflate scales throughput
  units up and never back down, so review provisioned units monthly and lower them by hand.
when_to_use: 'Any time Azure telemetry needs to reach Abstract: Activity Log, Entra ID sign-in and audit
  logs, Defender XDR streaming, or resource logs.'
when_not_to_use: Microsoft Graph API and Microsoft 365 unified-audit collection, which are API-pull integrations
  behind an Entra app registration and need no hub.
live_test: canary
lint_skip:
- check: 'arm-ttk:Template Should Not Contain Blanks'
  reason: False positive. An optional array or object parameter with an empty default compiles to [] or {}, and that empty default is intended.
