id: azure-source-entra-id-logs-tenant
title: Entra ID logs
cloud: azure
role: source
scope: tenant
summary: Entra ID activity logs are a single tenant-level diagnostic setting on the microsoft.aadiam provider,
  not Azure Monitor resource logs. Azure Policy cannot manage them, and a portal deployment at tenant scope
  is still pending proof, so for now one CLI command onboards identity telemetry for the whole organisation.
formats:
- bicep
- arm
- script
depends_on:
- azure-foundation-event-hub
permissions:
- role: Security Administrator (Entra directory role, not Azure RBAC)
  where: The Entra tenant
  why: 'Deployer: Create or edit the tenant diagnostic setting; subscription or management-group ownership
    does not grant it.'
- role: Attribute Log Administrator (Entra directory role)
  where: The Entra tenant
  why: 'Deployer: Only for CustomSecurityAttributeAuditLogs.'
- role: listKeys on the Event Hub authorization rule
  where: The Event Hubs namespace
  why: 'Deployer: Creating a setting that streams to an Event Hub requires ListKey on the target rule.'
- role: Send on the Event Hub authorization rule
  where: The namespace or the hub
  why: 'Azure Monitor: The streaming mechanism writes with the key of the referenced rule.'
creates:
- One tenant-level Entra ID diagnostic setting (default name abstract-entra-logstream) streaming the chosen
  categories to the identity hub
never_touches:
- The Event Hub and its authorization rule, which must already exist
- Other Entra ID diagnostic settings with different names, such as one sending to another SIEM
- Azure Monitor resource logs and subscription Activity Log settings
- Conditional Access, users, groups and every other Entra ID configuration
prerequisites:
- The Event Hub namespace exists in the same Entra tenant as the logs
- Entra ID P1 or P2 for ProvisioningLogs and MicrosoftGraphActivityLogs, P2 for the ID Protection risk
  categories; AuditLogs and SignInLogs are available on Free
- At most 5 diagnostic settings on the tenant, including existing exports
- Expect 24 hours to 3 days before first data; there is no backfill
- 'A redeploy replaces the named diagnostic setting''s category list rather than merging it; read it back
  first: az rest --method get --url "https://management.azure.com/providers/microsoft.aadiam/diagnosticSettings?api-version=2017-04-01"'
parameters:
- name: settingName
  type: string
  required: false
  description: Name of the Entra ID diagnostic setting. Multiple settings are allowed, so this can sit
    alongside a setting you already send to another SIEM.
  default: abstract-entra-logstream
- name: eventHubAuthorizationRuleId
  type: string
  required: true
  description: 'Resource ID of an Event Hubs namespace authorization rule with Send rights. Use the abstractDiagnosticsAuthRuleId
    output of main.bicep. Find it with: az eventhubs namespace authorization-rule list -g RESOURCE_GROUP
    --namespace-name NAMESPACE --query [].id -o tsv'
  find_it: az eventhubs namespace authorization-rule list -g <resource-group> --namespace-name <namespace>
    --query "[?name=='abstract-diagnostics-send'].id" -o tsv
- name: eventHubName
  type: string
  required: false
  description: Event Hub that receives the Entra ID stream. Give identity its own hub so it can be partitioned
    and scaled independently of resource logs.
  default: abs-prod-entra
  find_it: az eventhubs eventhub list -g <resource-group> --namespace-name <namespace> --query [].name
    -o tsv
- name: entraLogCategories
  type: array
  required: false
  description: "Entra ID log categories to stream. Defaults to the security-relevant set that\nevery Abstract\
    \ Entra detection is built on.\n\nLicensing / availability notes (revised 2026-08-26 against Microsoft's\
    \ own\nlicensing table - the previous note overstated the P1 requirement):\n  AuditLogs, SignInLogs\
    \        - available on Entra ID FREE. Microsoft's\n                                 monitoring-and-health\
    \ licensing table lists\n                                 both as \"Yes\" for Free and for P1/P2.\n\
    \  NonInteractiveUserSignInLogs,\n  ServicePrincipalSignInLogs,\n  ManagedIdentitySignInLogs    -\
    \ NO documented P1/P2 requirement exists for\n                                 these as diagnostic-setting\
    \ EXPORT categories.\n                                 All 80 files in Microsoft's\n             \
    \                    identity/monitoring-health docs were checked.\n                             \
    \    The real P1/P2 gate people are thinking of is\n                                 on DOWNLOADING\
    \ sign-in logs via the Microsoft\n                                 Graph API, which is a different\
    \ operation.\n                                 Treat a P1 claim here as unverified.\n  ProvisioningLogs\
    \             - P1/P2 (Free = \"No\" in the licensing table),\n                                 and\
    \ only populated when you provision via Entra\n  MicrosoftGraphActivityLogs   - P1/P2, explicitly\
    \ stated\n  RiskyUsers, UserRiskEvents,\n  RiskyServicePrincipals, ServicePrincipalRiskEvents,\n \
    \ RiskyAgents, AgentRiskEvents - Entra ID Protection (P2)\n  ADFSSignInLogs               - only when\
    \ AD FS is in use\n  NetworkAccessTrafficLogs,\n  EnrichedOffice365AuditLogs,\n  RemoteNetworkHealthLogs\
    \      - only with Global Secure Access / Entra\n                                 Internet Access\
    \ + Private Access\n  MicrosoftGraphActivityLogs   - high volume; the single best source for\n   \
    \                              \"what did this token actually do\". At 100k\n                    \
    \             users Microsoft publishes ~1,000 GiB/month and\n                                 ~4.8M\
    \ Event Hubs messages/month. Size for it.\n  MicrosoftServicePrincipalSignInLogs - preview, VERY high\
    \ volume, first-party\n                                 service-to-service. Microsoft advises against\n\
    \                                 acting on it. Off by default here.\n  CustomSecurityAttributeAuditLogs\
    \ - needs Attribute Log Administrator, and\n                                 Microsoft recommends\
    \ keeping it separate from\n                                 the directory audit stream.\n  B2CRequestLogs\
    \               - Azure AD B2C tenants only.\n\nSelecting a category your tenant does not license\
    \ or use is harmless - it simply\nproduces no records. Note the corollary, which is a silent-failure\
    \ shape: a\ncategory can be selectable and emit nothing forever because the underlying\nPRODUCT is\
    \ not in use (NetworkAccessTrafficLogs without Global Secure Access is\nthe common case), and that\
    \ is indistinguishable from a broken pipeline unless\nyou know to expect it.\n\nVolume: Microsoft\
    \ states non-interactive and service-principal sign-ins \"can be\n5 to 10 times larger than the interactive\
    \ user sign-ins\". Per-event sizes are\n~2 KB for audit and ~11.5 KB for sign-ins; a 100,000-user\
    \ tenant runs about\n1.5 million events per day.\n"
  default:
  - AuditLogs
  - SignInLogs
  - NonInteractiveUserSignInLogs
  - ServicePrincipalSignInLogs
  - ManagedIdentitySignInLogs
  - ProvisioningLogs
  - ADFSSignInLogs
  - RiskyUsers
  - UserRiskEvents
  - RiskyServicePrincipals
  - ServicePrincipalRiskEvents
  - MicrosoftGraphActivityLogs
outputs:
- diagnosticSettingName
- eventHubName
- streamedCategories
- abstractOnboarding
abstract:
  integration: azure_eventhub
verify:
- check: The diagnostic setting exists and lists the expected categories
  command: az rest --method get --url "https://management.azure.com/providers/microsoft.aadiam/diagnosticSettings?api-version=2017-04-01"
  healthy: The named setting is present with the intended category list and the correct hub.
- check: Messages are arriving on the identity hub specifically
  healthy: Incoming Messages non-zero on the identity hub; zero for under 24 hours is expected.
- check: Sign-in events parse as Entra events, not generic Activity Log
  healthy: A sampled sign-in event has user, IP and result populated.
cost: The setting is free; volume into the hub is the charge. MicrosoftGraphActivityLogs grows steeply
  with user count and can dominate a namespace, so size for it deliberately.
when_to_use: 'Always, and early: sign-in and audit logs carry the identity detections customers care about.'
when_not_to_use: Microsoft Graph API or Microsoft 365 unified-audit collection, which are API-pull integrations
  behind an app registration and use no Event Hub.
live_test: canary
