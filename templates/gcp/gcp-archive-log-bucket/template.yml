id: gcp-archive-log-bucket
title: 'Archive Google Cloud logs to Cloud Storage: second sink'
cloud: gcp
role: archive
scope: organization
summary: 'A second organization sink writing to a Cloud Storage bucket for evidence and backfill, because
  a sink has exactly one destination. It is not the detection path: storage batches, so latency is minutes
  to hours.'
formats:
- terraform
- script
- cloud-shell
permissions:
- role: roles/storage.admin
  where: The logging project
  why: 'Deployer: Create the bucket.'
- role: roles/storage.objectCreator
  where: The bucket
  why: 'Archive sink writer identity: Distinct from the streaming sink''s identity; each sink needs its
    own grant.'
creates:
- A Cloud Storage archive bucket, with optional retention policy, versioning, CMEK and Nearline transition
- An organization archive sink with its own writer identity
- roles/storage.objectCreator for that writer identity on the bucket
never_touches:
- 'The streaming Pub/Sub pipeline and its sink: the archive is a second sink with its own writer identity'
- 'Existing buckets: it creates a new bucket by name'
- 'A retention lock: none unless archive_retention_locked is set, which is irreversible'
prerequisites:
- Use the streaming deployment's effective_filter exactly, or read it through remote_state_bucket
- 'Decide retention deliberately: a retention lock is irreversible for the life of the bucket'
parameters:
- name: org_id
  type: string
  required: true
  description: 'Organization ID the archive sink binds to. Find it with: gcloud organizations list'
  find_it: gcloud organizations list --format='value(ID)'
- name: log_project
  type: string
  required: true
  description: 'DEDICATED logging or security project holding the archive sink. Find it with: gcloud projects
    list. If no dedicated logging project exists yet, create one first with templates/gcp/gcp-foundation-logging-project
    (set create_project = true) — do not point this at a workload project.'
  find_it: gcloud projects list --format='value(projectId)'
  example: acme-security-logging
- name: archive_bucket_name
  type: string
  required: true
  description: 'Globally unique across ALL of GCS, so prefix it with your org: acme-abstract-audit-archive.
    Existing buckets: gcloud storage buckets list'
- name: filter
  type: string
  required: false
  description: 'Fallback filter, used only when remote_state_bucket and stream_filter are both empty.
    Prefer remote state: an archive that quietly captures LESS than the stream is worse than no archive,
    because you will trust it during an investigation.'
  default: ''
- name: sink_name
  type: string
  required: false
  description: Name of the Cloud Logging sink.
  default: abstract-org-audit-sink
- name: archive_bucket_location
  type: string
  required: false
  description: US, EU, or a region. Consider data-residency obligations before defaulting.
  default: US
- name: archive_retention_days
  type: int
  required: false
  description: Retention period in days; 0 disables. On its own this is a DEFAULT that anyone with storage.buckets.update
    can shorten or remove. Pair it with archive_retention_locked to make it immutable.
  default: 0
- name: archive_nearline_after_days
  type: int
  required: false
  description: Move archived objects to Nearline after this many days.
  default: 30
- name: labels
  type: object
  required: false
  description: Labels applied to every resource this template creates.
  default: {}
- name: archive_retention_locked
  type: bool
  required: false
  description: LOCK the retention policy. IRREVERSIBLE — once set, the period cannot be shortened or removed
    for the life of the bucket, by anyone. This is what makes the archive evidentiary; it is also why
    it is not the default.
  default: false
- name: archive_versioning
  type: bool
  required: false
  description: Keep superseded object versions.
  default: true
- name: archive_cmek_key
  type: string
  required: false
  description: Customer-managed KMS key. The Cloud Storage service agent needs roles/cloudkms.cryptoKeyEncrypterDecrypter
    on it.
  default: ''
- name: stream_filter
  type: string
  required: false
  description: Optional. Paste `terraform output -raw effective_filter` from gcp-source-audit-logs-organization
    here and a check block asserts the archive matches the stream. Empty skips the check — but then nothing
    stops the two diverging.
  default: ''
- name: remote_state_bucket
  type: string
  required: false
  description: GCS bucket holding gcp-source-audit-logs-organization's state. Set it and the value below
    is READ rather than retyped. Empty uses the literal.
  default: ''
- name: remote_state_prefix
  type: string
  required: false
  description: State key of gcp-source-audit-logs-organization. It keeps that folder's original name,
    01-organization, so existing state is found.
  default: 01-organization
outputs:
- archive_bucket
verify:
- check: Objects are landing in the bucket
  healthy: The bucket fills; if it stays empty, check the archive writer identity's binding.
cost: Cloud Storage at Standard, then Nearline after archive_nearline_after_days; no retention lock and
  no deletion by default, so storage grows until a lifecycle or retention policy is chosen.
when_to_use: Evidence retention and backfill alongside the Pub/Sub stream.
when_not_to_use: Anything you alert on; keep Pub/Sub for detection.
live_test: static
