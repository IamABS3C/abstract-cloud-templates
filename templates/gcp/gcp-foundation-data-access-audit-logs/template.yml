id: gcp-foundation-data-access-audit-logs
title: 'Turn on Data Access audit logs: organization, folder or project'
cloud: gcp
role: foundation
scope: organization
summary: Admin Activity audit logs are always on; Data Access logs are off by default for every service
  except BigQuery, and until they are on a sink filter referencing data_access matches nothing for the others. This deployment enables the chosen Data
  Access log types in separate state from the log-export pipeline.
formats:
- terraform
- script
- cloud-shell
permissions:
- role: roles/resourcemanager.organizationAdmin or roles/iam.securityAdmin (resourcemanager.organizations.setIamPolicy)
  where: The organization, when scope = organization
  why: 'Deployer: This modifies the organization IAM policy''s audit configuration.'
- role: roles/resourcemanager.folderAdmin or roles/iam.securityAdmin (resourcemanager.folders.setIamPolicy)
  where: The folder, when scope = folder
  why: 'Deployer: This modifies the folder IAM policy''s audit configuration.'
- role: roles/resourcemanager.projectIamAdmin or roles/iam.securityAdmin (resourcemanager.projects.setIamPolicy)
  where: The project, when scope = project
  why: 'Deployer: This modifies the project IAM policy''s audit configuration.'
creates:
- An IAM audit config at the chosen scope (organization, folder or project) enabling the listed Data Access
  log types
cleanup_note: 'To stop managing these settings and leave logging as it is, run terraform state rm ''module.audit_config'' with the same backend.tf. terraform destroy instead turns Data Access audit logging OFF for every service this template manages, including any setting that existed before you applied it, because the audit config is authoritative for those services. Use it only to turn that logging off on purpose. Admin Activity logs are always on and are not affected.'
never_touches:
- 'Admin Activity audit logs: always on, and nothing here can turn them off'
- 'The log-export pipeline: this is deliberately separate state'
prerequisites:
- 'Read the preflight output first. The template applies ONE log_types list and ONE exempted_members list to every
  service it names, replacing what each one has today: name only services whose existing settings you accept being
  replaced by those, and leave out any service that already has DATA_READ or exempted members, or manage it only
  from a separate root with its own backend prefix, after removing it from this root''s services'
- acknowledge_authoritative_overwrite = true on every apply, after reading the preflight output, and acknowledge_data_read
  for DATA_READ on allServices
parameters:
- name: scope
  type: string
  required: false
  description: organization | folder | project. Inheritance is ONE-WAY — a project can add Data Access
    logging but cannot disable what the organization enabled.
  default: organization
- name: org_id
  type: string
  required: false
  description: 'Organization ID, when scope = organization. Find it with: gcloud organizations list'
  default: ''
  find_it: gcloud organizations list --format='value(ID)'
- name: folder_id
  type: string
  required: false
  description: 'Folder ID, when scope = folder. Find it with: gcloud resource-manager folders list --organization=ORG_ID'
  default: ''
  find_it: gcloud resource-manager folders list --organization=ORG_ID
- name: project_id
  type: string
  required: false
  description: Project ID, when scope = project.
  default: ''
- name: log_types
  type: array
  required: false
  description: ADMIN_READ | DATA_WRITE | DATA_READ. ADMIN_WRITE is rejected — that is Admin Activity,
    always on.
  default:
  - ADMIN_READ
  - DATA_WRITE
- name: services
  type: array
  required: false
  description: Services to turn Data Access logs on for. Name them; the guided setup's five are the example.
    Empty means allServices, which is authoritative for every service at this scope and, with DATA_READ, the
    expensive option that needs acknowledge_data_read. Service account token minting and impersonation is
    recorded only through iam.googleapis.com (ADMIN_READ); iamcredentials.googleapis.com is refused at plan,
    because it does nothing. Add sts.googleapis.com for Workload Identity Federation. The template applies ONE
    log_types list and ONE exempted_members list to every service it names, so leave out any service that
    already has DATA_READ or exempted members, or manage it only from a separate root with its own backend
    prefix, after removing it from this root's services.
  default: []
  example:
  - bigquery.googleapis.com
  - storage.googleapis.com
  - cloudkms.googleapis.com
  - iam.googleapis.com
  - sts.googleapis.com
- name: exempted_members
  type: array
  required: false
  description: Principals excluded. One chatty ETL service account can dominate DATA_READ volume while
    carrying no security signal — this is the most-missed cost lever.
  default: []
- name: acknowledge_data_read
  type: bool
  required: false
  description: Required for DATA_READ when services is empty (allServices).
  default: false
- name: acknowledge_authoritative_overwrite
  type: bool
  required: false
  description: Required on every apply. The audit config is authoritative for every service it names, not
    only allServices - applying REPLACES the log types and exempted members already set on those services,
    and destroy REMOVES them. Read tools/gcp-guided-setup/preflight.sh output first. To offboard without
    changing logging, run terraform state rm 'module.audit_config'.
  default: false
  example: true
outputs:
- enabled
verify:
- check: See what is already enabled
  command: ./tools/gcp-guided-setup/preflight.sh --project "$LOG_PROJECT" --org-id "$ORG_ID"
  healthy: The audit config lists exactly the services and log types you chose.
cost: BigQuery DATA_READ on a BigQuery-heavy estate can move total volume by one to two orders of magnitude;
  scope it to BigQuery and regulated buckets rather than refusing it.
when_to_use: Data Access signal (BigQuery reads, Cloud Storage object reads, KMS use) is needed, decided
  per service.
when_not_to_use: To change Admin Activity logs, which are always on; or before reading the current audit
  config, because this resource is authoritative per service.
live_test: static
references:
- audit-logs-overview
- data-access-config
- iam-audit
- iamcredentials-audit
- sts-audit
- tf-google_organization_iam_audit_config
