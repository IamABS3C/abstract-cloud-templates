id: gcp-foundation-logging-project
title: 'Google Cloud first step: logging project and APIs'
cloud: gcp
role: foundation
scope: project
summary: 'Optional: enables the APIs the pipeline needs on an existing project, or creates a dedicated
  logging project with a billing account. Most customers already have a security or logging project and
  can skip it.'
formats:
- terraform
- script
- cloud-shell
permissions:
- role: roles/resourcemanager.projectCreator
  where: The organization or folder
  why: 'Deployer: Only with create_project=true.'
- role: roles/billing.user
  where: The billing account
  why: 'Deployer: Only with create_project=true.'
creates:
- The required APIs enabled on the logging project
- Optionally, a new logging project with deletion_policy PREVENT (create_project=true)
cleanup_note: 'terraform destroy never deletes the logging project: a project it created has deletion_policy PREVENT, and the APIs stay on (disable_on_destroy = false). Delete the project yourself in the console only when nothing else uses it; Google keeps it recoverable for 30 days.'
never_touches:
- 'An existing project''s IAM policy and resources: with create_project = false it only enables APIs'
- Enabled APIs on destroy (disable_on_destroy = false)
prerequisites:
- A billing account, when creating the project; a project without one cannot publish to Pub/Sub
parameters:
- name: create_project
  type: bool
  required: false
  description: FALSE (default) only enables APIs on an existing project. TRUE also creates it, which needs
    billing_account_id and project-creator rights.
  default: false
- name: project_id
  type: string
  required: true
  description: Project ID to use, or to create when create_project = true (globally unique, 6-30 characters,
    lowercase).
- name: project_name
  type: string
  required: false
  description: Display name when creating the project.
  default: Abstract Security Logging
- name: org_id
  type: string
  required: false
  description: 'Organization to create the project under (create_project = true). Find it with: gcloud
    organizations list'
  default: ''
  find_it: gcloud organizations list --format='value(ID)'
- name: folder_id
  type: string
  required: false
  description: Create the project under this folder instead of directly under the organization.
  default: ''
  find_it: gcloud resource-manager folders list --organization=<org-id>
- name: billing_account_id
  type: string
  required: false
  description: 'Required when create_project = true. A project with no billing account cannot publish
    to Pub/Sub. Globally unique, 6-30 chars, lowercase. This is the ID you are creating, not one to look
    up — confirm it is still free with: gcloud projects list'
  default: ''
  find_it: gcloud billing accounts list --filter=open=true
- name: enable_workspace_api
  type: bool
  required: false
  description: Also enable the Admin SDK API, for gcp-source-google-workspace-logs.
  default: false
- name: enable_scc_api
  type: bool
  required: false
  description: Also enable the Security Command Center API, for gcp-source-security-command-center-findings.
  default: false
- name: labels
  type: object
  required: false
  description: Labels applied to every resource this template creates.
  default: {}
outputs:
- enabled_apis
- preflight
- project_id
verify:
- check: See the grants Terraform cannot verify
  command: terraform output preflight
  healthy: It names the remaining grants, including roles/logging.configWriter at the organization.
cost: Enabling APIs is free; a created project costs nothing until resources in it are billed.
when_to_use: Greenfield, or when the only candidate is a workload project.
when_not_to_use: When a security or logging project already exists; point gcp-source-audit-logs-organization
  at it instead.
live_test: static
