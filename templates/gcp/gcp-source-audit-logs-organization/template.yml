id: gcp-source-audit-logs-organization
title: 'All Google Cloud audit logs to Abstract: organization sink'
cloud: gcp
role: source
scope: organization
summary: One aggregated Cloud Logging sink at organization scope routes audit and platform logs from every
  project into one Pub/Sub topic for Abstract. Projects created later are covered automatically, because
  the sink's scope is containment rather than a list.
formats:
- terraform
- script
- cloud-shell
permissions:
- role: roles/logging.configWriter
  where: The organization
  why: 'Deployer: Create the aggregated sink; the blocking prerequisite, rarely held by whoever owns the
    project.'
- role: roles/pubsub.admin
  where: The logging project
  why: 'Deployer: Create the topic, subscription and IAM bindings.'
- role: roles/iam.serviceAccountAdmin
  where: The logging project
  why: 'Deployer: Create Abstract''s service account.'
- role: roles/serviceusage.serviceUsageAdmin
  where: The logging project
  why: 'Deployer: Enable APIs.'
- role: roles/pubsub.publisher
  where: The topic
  why: 'Sink writer identity: Created with the sink and holding nothing until granted; this module grants
    it.'
- role: roles/pubsub.subscriber
  where: The subscription only
  why: 'Abstract service account: Abstract pulls; not publisher, not project-wide.'
creates:
- A Pub/Sub topic (default abstract-audit-logs) and a never-expiring pull subscription (default abstract-audit-logs-sub,
  7-day retention)
- The roles/pubsub.publisher binding for the sink's writer identity
- A service account (default abstract-pubsub-reader) with roles/pubsub.subscriber on the subscription
  only
- Optional dead-letter topic (enable_dead_letter, off by default)
- An aggregated organization sink (default abstract-org-audit-sink) with include_children
never_touches:
- Existing sinks, including _Default and _Required
- Data Access audit configuration (gcp-foundation-data-access-audit-logs owns that)
- 'IAM in workload projects: every grant is on the topic or the subscription'
prerequisites:
- A dedicated logging or security project, not a workload project
- The organization ID
- Data Access audit logs are off by default; a filter referencing data_access matches nothing until they
  are enabled
- The org policy constraints/iam.disableServiceAccountKeyCreation blocks the key Abstract authenticates
  with
parameters:
- name: org_id
  type: string
  required: true
  description: 'Organization ID. Find it with: gcloud organizations list'
  find_it: gcloud organizations list --format='value(ID)'
- name: log_project
  type: string
  required: true
  description: 'DEDICATED logging or security project holding the topic and subscription. Not a workload
    project — Pub/Sub publish quota is consumed here, and a workload owner should not be able to read
    or break the security pipeline. Find it with: gcloud projects list. If no dedicated logging project
    exists yet, create one first with templates/gcp/gcp-foundation-logging-project (set create_project
    = true) — do not point this at a workload project.'
  find_it: gcloud projects list --format='value(projectId)'
  example: acme-security-logging
- name: log_categories
  type: array
  required: false
  description: Named sources to route. See _modules/log-export/log_catalog.tf for the catalog.
  default:
  - admin_activity
  - system_event
  - policy_denied
  - gke_control_plane
  - firewall
  - dns_queries
  example:
  - admin_activity
  - system_event
  - policy_denied
  - gke_control_plane
  - firewall
  - dns_queries
  - nat_flows
  - load_balancer
  - cloudsql
- name: data_access_services
  type: array
  required: false
  description: When data_access_all is in log_categories, restrict Data Access logs to these services
    rather than the whole estate. Empty means allServices, the expensive option. Use the serviceName the
    events carry - for service account token minting that is iamcredentials.googleapis.com, even though
    gcp-foundation-data-access-audit-logs turns it on as iam.googleapis.com - and add sts.googleapis.com for
    Workload Identity Federation.
  default:
  - bigquery.googleapis.com
  - storage.googleapis.com
  - cloudkms.googleapis.com
- name: exclusions
  type: array
  required: false
  description: Sink exclusion filters for known noise (health checks, chatty service accounts). Exclusions
    cost nothing to evaluate while ingestion and Pub/Sub throughput are billed, so this is the cheapest
    cost lever. Max 50 per sink.
  default: []
  example:
  - name: exclude-health-checks
    description: GCP health-check prober traffic. High volume, zero security signal.
    filter: protoPayload.requestMetadata.callerSuppliedUserAgent=~"GoogleHC"
- name: acknowledge_high_volume
  type: bool
  required: false
  description: Required to select any extreme-tier category (vpc_flows, gke_container_logs, data_access_all).
    These can dominate the bill; measure a 7-day baseline first.
  default: false
- name: labels
  type: object
  required: false
  description: Labels applied to every resource this template creates.
  default: {}
  example:
    owner: security
    managed_by: terraform
- name: retention_days
  type: int
  required: false
  description: 'Pub/Sub message retention, 1-31. THIS IS YOUR ENTIRE RECOVERY WINDOW: when the oldest
    unacked message reaches it, the data is deleted permanently with no error and no backfill. 7 gives
    you a long weekend.'
  default: 7
- name: ack_deadline_seconds
  type: int
  required: false
  description: Pub/Sub ack deadline for Abstract's subscription, in seconds.
  default: 60
- name: enable_dead_letter
  type: bool
  required: false
  description: Send repeatedly-failing messages to a dead-letter topic instead of retrying forever. Pair
    it with gcp-monitoring-pipeline-health-alerts — a dead-letter topic nobody watches converts a loud
    failure into a silent one.
  default: false
- name: dead_letter_max_delivery_attempts
  type: int
  required: false
  description: Deliveries attempted before a message is dead-lettered (Pub/Sub allows 5-100). Used only
    with enable_dead_letter.
  default: 5
- name: topic_name
  type: string
  required: false
  description: Renaming this FORCE-REPLACES the topic and cascades to the subscription, discarding every
    un-acked message. prevent_destroy blocks it; that is intentional.
  default: abstract-audit-logs
- name: subscription_name
  type: string
  required: false
  description: Pull subscription Abstract reads. Renaming it replaces the subscription.
  default: abstract-audit-logs-sub
- name: sink_name
  type: string
  required: false
  description: Name of the Cloud Logging sink.
  default: abstract-org-audit-sink
- name: service_account_id
  type: string
  required: false
  description: Account ID of the service account Abstract authenticates as (roles/pubsub.subscriber on
    the subscription only).
  default: abstract-pubsub-reader
- name: custom_filter
  type: string
  required: false
  description: Replace the assembled filter entirely. Bypasses every guard in the catalog -- you own the
    volume.
  default: ''
- name: platform_log_filters
  type: array
  required: false
  description: Extra raw logName clauses the catalog does not cover, e.g. cloudaudit.googleapis.com%2Faccess_transparency
  default: []
outputs:
- abstract_onboarding
- effective_filter
- selected_log_sources
- sink_writer_identity
- volume_profile
abstract:
  integration: google_cloud_pub_sub
verify:
- check: The sink exists and is aggregated
  command: gcloud logging sinks describe abstract-org-audit-sink --organization="$ORG_ID" --format="value(name,includeChildren,destination)"
  healthy: includeChildren is True and the destination is the Abstract topic.
- check: The writer identity holds publisher on the topic
  command: gcloud pubsub topics get-iam-policy abstract-audit-logs --project="$LOG_PROJECT"
  healthy: The sink's writer identity has roles/pubsub.publisher.
- check: A fresh event flows end to end
  command: 'PROBE=abstract-probe-$(date +%s)

    gcloud pubsub subscriptions create "$PROBE" --topic=abstract-audit-logs --project=<log-project-id>
    --expiration-period=1d

    gcloud pubsub topics create abstract-probe-topic --project=<log-project-id> --quiet

    gcloud pubsub topics delete abstract-probe-topic --project=<log-project-id> --quiet

    sleep 75

    gcloud pubsub subscriptions pull "$PROBE" --project=<log-project-id> --limit=5 --auto-ack

    gcloud pubsub subscriptions delete "$PROBE" --project=<log-project-id> --quiet'
  healthy: 'Your own CreateTopic and DeleteTopic arrive on the probe subscription with principalEmail,
    resourceName and callerIp populated. Wait five minutes after creating the sink before testing. Never
    pull from Abstract''s own subscription: --auto-ack there deletes events before Abstract reads them.'
- check: No sink errors
  command: gcloud logging read 'logName:"logging.googleapis.com%2Fsink_error"' --limit=20 --project=<log-project-id>
  healthy: No sink_error entries.
cost: Pub/Sub throughput is usually the largest line. BigQuery Data Access reads are both the richest
  exfiltration signal and the biggest cost driver, able to move volume by one to two orders of magnitude.
when_to_use: Every GCP engagement, from a single project up to a multi-folder organization.
when_not_to_use: Logs already sitting as objects in a bucket, Google Workspace sign-ins, and Security
  Command Center findings, which each have their own path.
live_test: canary
