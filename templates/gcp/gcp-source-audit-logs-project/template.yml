id: gcp-source-audit-logs-project
title: 'One project''s audit logs to Abstract: project sink'
cloud: gcp
role: source
scope: project
summary: A project-scope sink that shows the pipeline working, from the sink to Abstract, before
  organization-scope IAM is requested. It does not cover future or other projects; replace it with the organization sink once
  the pilot is proven.
formats:
- terraform
- script
- cloud-shell
permissions:
- role: roles/logging.configWriter
  where: The project
  why: 'Deployer: Create the project sink.'
- role: roles/pubsub.admin
  where: The logging project
  why: 'Deployer: Create the topic, subscription and IAM bindings.'
- role: roles/iam.serviceAccountAdmin
  where: The logging project
  why: 'Deployer: Create Abstract''s service account.'
- role: roles/serviceusage.serviceUsageAdmin
  where: The logging project
  why: 'Deployer: Enable APIs.'
- role: roles/pubsub.publisher
  where: The topic
  why: 'Sink writer identity: Created with the sink and holding nothing until granted; this module grants
    it.'
- role: roles/pubsub.subscriber
  where: The subscription only
  why: 'Abstract service account: Abstract pulls; not publisher, not project-wide.'
creates:
- A Pub/Sub topic (default abstract-audit-logs) and a never-expiring pull subscription (default abstract-audit-logs-sub,
  7-day retention)
- The roles/pubsub.publisher binding for the sink's writer identity
- A service account (default abstract-pubsub-reader) with roles/pubsub.subscriber on the subscription
  only
- Optional dead-letter topic (enable_dead_letter, off by default)
- A project sink, acknowledged as pilot scope
never_touches:
- 'Other projects, and projects created later: a project sink has no include_children'
prerequisites:
- One project to pilot on
- 'Deployed from an earlier version of this template? Apply it again. The default log_categories now routes only
  Cloud Audit Logs: firewall and DNS logs are dropped from the filter unless your terraform.tfvars lists them, and
  Abstract''s managed GCP parser discards them anyway (collect them with gcp-source-network-threat-logs). The apply
  also adds the managed-by marker to the sink''s description, which tells the guided setup to advise a tfvars change
  instead of editing the sink.'
parameters:
- name: org_id
  type: string
  required: false
  description: Organization ID. Optional for a project-scope pilot.
  default: ''
  find_it: gcloud organizations list --format='value(ID)'
- name: sink_project
  type: string
  required: true
  description: 'The ONE project whose logs are exported: the project running the workload you are piloting.
    It may be the same as log_project for a pilot, but a dedicated logging project runs no workload and exports
    almost nothing. Find it with: gcloud projects list'
  find_it: gcloud projects list --format='value(projectId)'
  example: WORKLOAD_PROJECT_ID
- name: log_project
  type: string
  required: true
  description: 'DEDICATED logging or security project holding the topic and subscription. Not a workload
    project — Pub/Sub publish quota is consumed here, and a workload owner should not be able to read
    or break the security pipeline. Find it with: gcloud projects list. If no dedicated logging project
    exists yet, create one first with templates/gcp/gcp-foundation-logging-project (set create_project
    = true) — do not point this at a workload project.'
  find_it: gcloud projects list --format='value(projectId)'
  example: LOGGING_PROJECT_ID
- name: log_categories
  type: array
  required: false
  description: Named sources to route, from the catalog in templates/gcp/_modules/log-export/log_catalog.tf.
    The default is the three Cloud Audit Logs that Abstract's managed GCP Pub/Sub parser stores (Admin Activity,
    System Event, Policy Denied); that parser drops every record that is not a Cloud Audit Log, so firewall, DNS,
    NAT, load-balancer and Cloud SQL logs routed here are pulled and discarded. Use gcp-source-network-threat-logs
    for those. To record service account token minting (iamcredentials.googleapis.com) and Workload Identity
    Federation (sts.googleapis.com), add identity_access and apply this before turning their Data Access logs on
    with gcp-foundation-data-access-audit-logs. It is low volume and needs no acknowledgement.
  default:
  - admin_activity
  - system_event
  - policy_denied
  example:
  - admin_activity
  - system_event
  - policy_denied
  - identity_access
- name: data_access_services
  type: array
  required: false
  description: Read only when data_access_all is in log_categories; on its own this list routes nothing, identity
    services included (for those, add identity_access to log_categories instead). With data_access_all, it
    restricts Data Access logs to these services rather than the whole estate; empty means every service, the
    expensive option. Use the serviceName the events carry - for service account token minting that is
    iamcredentials.googleapis.com, even though gcp-foundation-data-access-audit-logs turns it on as
    iam.googleapis.com - and sts.googleapis.com for Workload Identity Federation.
  default:
  - bigquery.googleapis.com
  - storage.googleapis.com
  - cloudkms.googleapis.com
  - iamcredentials.googleapis.com
  - sts.googleapis.com
- name: exclusions
  type: array
  required: false
  description: Sink exclusion filters for known noise (health checks, chatty service accounts). Exclusions
    cost nothing to evaluate while ingestion and Pub/Sub throughput are billed, so this is the cheapest
    cost lever. Max 50 per sink.
  default: []
  example:
  - name: exclude-health-checks
    description: GCP health-check prober traffic. High volume, zero security signal.
    filter: protoPayload.requestMetadata.callerSuppliedUserAgent=~"GoogleHC"
- name: acknowledge_high_volume
  type: bool
  required: false
  description: Required to select an extreme-tier category (vpc_flows, gke_container_logs), and for
    data_access_all only when data_access_services is empty. These can dominate the bill; measure a 7-day
    baseline first.
  default: false
- name: labels
  type: object
  required: false
  description: Labels applied to every resource this template creates.
  default: {}
- name: retention_days
  type: int
  required: false
  description: 'Pub/Sub message retention, 1-31. THIS IS YOUR ENTIRE RECOVERY WINDOW: when the oldest
    unacked message reaches it, the data is deleted permanently with no error and no backfill. 7 gives
    you a long weekend.'
  default: 7
- name: ack_deadline_seconds
  type: int
  required: false
  description: Pub/Sub ack deadline for Abstract's subscription, in seconds.
  default: 60
- name: enable_dead_letter
  type: bool
  required: false
  description: Send repeatedly-failing messages to a dead-letter topic instead of retrying forever. Pair
    it with gcp-monitoring-pipeline-health-alerts — a dead-letter topic nobody watches converts a loud
    failure into a silent one.
  default: false
- name: dead_letter_max_delivery_attempts
  type: int
  required: false
  description: Deliveries attempted before a message is dead-lettered (Pub/Sub allows 5-100). Used only
    with enable_dead_letter.
  default: 5
- name: topic_name
  type: string
  required: false
  description: Renaming this FORCE-REPLACES the topic and cascades to the subscription, discarding every
    un-acked message. prevent_destroy blocks it; that is intentional.
  default: abstract-audit-logs
- name: subscription_name
  type: string
  required: false
  description: Pull subscription Abstract reads. Renaming it replaces the subscription.
  default: abstract-audit-logs-sub
- name: sink_name
  type: string
  required: false
  description: Name of the Cloud Logging sink.
  default: abstract-org-audit-sink
- name: service_account_id
  type: string
  required: false
  description: Account ID of the service account Abstract authenticates as (roles/pubsub.subscriber on
    the subscription only).
  default: abstract-pubsub-reader
- name: custom_filter
  type: string
  required: false
  description: Replace the assembled filter entirely. Bypasses every guard in the catalog -- you own the
    volume.
  default: ''
- name: platform_log_filters
  type: array
  required: false
  description: Extra raw logName clauses the catalog does not cover, e.g. cloudaudit.googleapis.com%2Faccess_transparency
  default: []
outputs:
- abstract_onboarding
- effective_filter
- selected_log_sources
- sink_writer_identity
- volume_profile
abstract:
  integration: google_cloud_pub_sub
verify:
- check: A fresh event reaches the topic from the sink
  command: ./tools/gcp-guided-setup/abstract-gcp-setup.sh --step 9
  healthy: 'A ✓ "the test event arrived" within five minutes, from the top folder of the repository. It writes a
    fresh event in your scope and waits on a probe subscription of its own, which it deletes; it never reads
    Abstract''s subscription. Wait five minutes after creating the sink before testing.'
- check: No sink errors
  command: gcloud logging read 'logName:"logging.googleapis.com%2Fsink_error"' --limit=20 --project="$LOG_PROJECT"
  healthy: No sink_error entries.
cost: Pub/Sub throughput for one project's audit logs.
when_to_use: Proving the pipeline before asking for organization-scope IAM.
when_not_to_use: 'As a per-project pattern: deploy gcp-source-audit-logs-organization and delete this
  sink once the pilot is proven.'
live_test: canary
references:
- audit-logs-overview
- route-to-pubsub
- logging-query-language
- pubsub-subscription-properties
- tf-google_logging_project_sink
- tf-google_pubsub_topic_iam
- tf-google_service_account_key
